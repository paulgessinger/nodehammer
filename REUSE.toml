version = 1

# Bulk annotation: every tracked file in this repo is original work authored by
# Paul Gessinger and licensed MIT, unless a per-file SPDX header says otherwise
# (in which case the in-file info is aggregated on top of this default).
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Gessinger"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/fontawesome7/IconsFontAwesome7.h"
precedence = "override"
SPDX-FileCopyrightText = "2017 Juliette Foucaut and Doug Binks"
SPDX-License-Identifier = "Zlib"

[[annotations]]
path = "third_party/fontawesome7/fa-solid-900.h"
precedence = "override"
SPDX-FileCopyrightText = "2026 Fonticons, Inc. (https://fontawesome.com)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "third_party/stb/stb_image_write.h"
precedence = "override"
SPDX-FileCopyrightText = "2010-2019 Sean Barrett"
# stb is offered under MIT OR Unlicense; we take it under MIT (already in
# LICENSES/) so no extra license text file is needed.
SPDX-License-Identifier = "MIT"
