<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>nodehammer viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1a1f25;
            color: #c5cdd9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            height: 100%;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        #status {
            position: fixed;
            left: 12px;
            bottom: 12px;
            font-size: 12px;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">loading…</div>
    <script>
        // Asset loading happens inside wasm via emscripten_fetch — see the
        // C++ AssetLoader. Top-level entry points have generic names so the
        // wasm shell isn't tied to a specific detector; override per-page
        // with ?input=… &config=…. Includes are discovered automatically by
        // walking the config's `include = [...]` array as each TOML file
        // arrives, so they don't need to be listed in the URL.
        var params = new URLSearchParams(window.location.search);
        var inputUrl = params.get('input') || 'scene.nhb.zst';
        var configUrl = params.get('config') || 'scene.toml';

        function queryBool(name) {
            var value = params.get(name);
            if (value === null) return null;
            value = value.toLowerCase();
            return !(value === '0' || value === 'false' || value === 'off' || value === 'no');
        }

        function appendBoolArg(args, queryName, trueFlag, falseFlag) {
            var value = queryBool(queryName);
            if (value === null) return;
            if (value && trueFlag) {
                args.push(trueFlag);
            } else if (!value && falseFlag) {
                args.push(falseFlag);
            }
        }

        function appendValueArg(args, queryName, flag) {
            var value = params.get(queryName);
            if (value !== null && value !== '') {
                args.push(flag, value);
            }
        }

        // Backend selection: WebGPU when available, WebGL2 otherwise. Force
        // a specific backend for A/B testing with ?backend=wgpu/webgpu or
        // ?backend=gles3/webgl2.
        var forced = (params.get('backend') || '').toLowerCase();
        var useWGPU;
        if (forced === 'wgpu' || forced === 'webgpu') {
            useWGPU = true;
        } else if (forced === 'gles3' || forced === 'webgl2' || forced === 'webgl') {
            useWGPU = false;
        } else {
            if (forced) {
                console.warn('unknown backend "' + forced + '", using auto-detect');
            }
            useWGPU = !!navigator.gpu;
        }
        var bundleBase = useWGPU ? 'nodehammer-wgpu' : 'nodehammer-gles3';

        var viewerArgs = [
            'viewer',
            '--input', '/' + inputUrl,
            '--config', '/' + configUrl,
        ];
        appendBoolArg(viewerArgs, 'cullBack', null, '--no-cull-back');
        appendBoolArg(viewerArgs, 'pauseWhenUnfocused', null, '--no-pause-when-unfocused');
        appendBoolArg(viewerArgs, 'autoOrbit', '--auto-orbit', null);
        appendValueArg(viewerArgs, 'orbitSpeed', '--orbit-speed');
        appendBoolArg(viewerArgs, 'angleCut', '--angle-cut', null);
        appendBoolArg(viewerArgs, 'shaderAngleCut', null, '--no-shader-angle-cut');
        appendValueArg(viewerArgs, 'cutStart', '--cut-start');
        appendValueArg(viewerArgs, 'cutEnd', '--cut-end');
        appendBoolArg(viewerArgs, 'pbr', '--pbr', null);
        appendValueArg(viewerArgs, 'cameraTargetX', '--camera-target-x');
        appendValueArg(viewerArgs, 'cameraTargetY', '--camera-target-y');
        appendValueArg(viewerArgs, 'cameraTargetZ', '--camera-target-z');
        appendValueArg(viewerArgs, 'cameraDistance', '--camera-distance');
        appendValueArg(viewerArgs, 'cameraYaw', '--camera-yaw');
        appendValueArg(viewerArgs, 'cameraPitch', '--camera-pitch');

        var statusEl = document.getElementById('status');
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function (msg) { console.log(msg); },
            printErr: function (msg) { console.error(msg); },
            setStatus: function (text) {
                if (text) {
                    statusEl.textContent = text;
                    statusEl.style.display = 'block';
                } else {
                    statusEl.style.display = 'none';
                }
            },
            // Tell emscripten where to fetch the .wasm sidecar (the loader
            // emits its own filename otherwise, which is fine — but with two
            // bundles in the same dir we want to be explicit).
            locateFile: function (path) {
                if (path.endsWith('.wasm')) return bundleBase + '.wasm';
                return path;
            },
            // No preRun preloads — assets are fetched from C++ via
            // emscripten_fetch after main() starts so imgui can render a
            // progress UI instead of blocking startup.
            arguments: viewerArgs,
        };
        Module.setStatus('loading ' + bundleBase + '…');
        window.onerror = function (msg) {
            Module.setStatus('error — see console');
            console.error(msg);
        };

        // Inject the matching loader script. emscripten's loader picks up
        // the global `Module` object set above and starts the wasm fetch
        // (via locateFile) as soon as it executes.
        var s = document.createElement('script');
        s.src = bundleBase + '.js';
        s.async = true;
        document.body.appendChild(s);
    </script>
</body>
</html>
