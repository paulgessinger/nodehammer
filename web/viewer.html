<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>nodehammer viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1a1f25;
            color: #c5cdd9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            height: 100%;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        #status {
            position: fixed;
            left: 12px;
            bottom: 12px;
            font-size: 12px;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">loading…</div>
    <script>
        // Filter bgfx's WebGL caps-probing chatter. At init bgfx queries every
        // texture format with getInternalformatParameter(); the browser logs a
        // warning when a format isn't valid as a renderbuffer, even though the
        // call returns the right "unsupported" answer. Harmless, just noisy.
        (function () {
            var origWarn = console.warn.bind(console);
            console.warn = function (msg) {
                if (typeof msg === 'string' &&
                    (msg.indexOf('getInternalformatParameter') !== -1)) {
                    return;
                }
                origWarn.apply(null, arguments);
            };
        })();

        // Asset loading via runtime fetch. Top-level entry points have
        // generic names so the wasm shell isn't tied to a specific detector;
        // override per-page with ?input=… &config=… &include=a&include=b
        // (include can repeat). The C++ TOML loader resolves `include = […]`
        // entries relative to the config's parent dir, so those fragment
        // paths must match what's in the toml — they keep their real names
        // even when the entry-point file is renamed to scene.toml.
        var params = new URLSearchParams(window.location.search);
        var inputUrl = params.get('input') || 'scene.nhb.zst';
        var configUrl = params.get('config') || 'scene.toml';

        // Transitive toml fragments to fetch. Hard-coded for now since the
        // include resolver runs in C++ at config-load time, so we can't
        // introspect from JS. Override via repeated ?include= query params.
        var configIncludes = params.getAll('include');
        if (configIncludes.length === 0) {
            configIncludes = [
                'odd/base.toml',
                'odd/materials.toml',
                'odd/tracker.toml',
                'odd/calorimeters.toml',
                'odd/muon.toml',
            ];
        }

        var statusEl = document.getElementById('status');
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function (msg) { console.log(msg); },
            printErr: function (msg) { console.error(msg); },
            setStatus: function (text) {
                if (text) {
                    statusEl.textContent = text;
                    statusEl.style.display = 'block';
                } else {
                    statusEl.style.display = 'none';
                }
            },
            preRun: [function () {
                // FS.createPreloadedFile expects (parent, name, url, canRead, canWrite).
                // It runs the fetch async; emscripten waits for all preRun work
                // to settle before invoking main(), so by the time the viewer
                // subcommand runs, fopen of these paths just works.
                Module.setStatus('fetching ' + inputUrl);
                FS.createPreloadedFile('/', inputUrl, inputUrl, true, false);
                FS.createPreloadedFile('/', configUrl, configUrl, true, false);
                FS.createPath('/', 'odd', true, false);
                for (var i = 0; i < configIncludes.length; ++i) {
                    var p = configIncludes[i];
                    var slash = p.lastIndexOf('/');
                    var dir = slash >= 0 ? p.substring(0, slash) : '';
                    var name = slash >= 0 ? p.substring(slash + 1) : p;
                    if (dir) {
                        FS.createPath('/', dir, true, false);
                    }
                    FS.createPreloadedFile('/' + (dir || ''), name, p, true, false);
                }
            }],
            arguments: [
                'viewer',
                '--input', '/' + inputUrl,
                '--config', '/' + configUrl,
            ],
        };
        Module.setStatus('downloading wasm…');
        window.onerror = function (msg) {
            Module.setStatus('error — see console');
            console.error(msg);
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
