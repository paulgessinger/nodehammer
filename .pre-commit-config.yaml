# https://pre-commit.com/ — compatible with prek (https://github.com/j178/prek)
# Install: brew install prek  (or see prek README)
# Enable:  prek install
# Run:     prek run --all-files

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.2
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        # Vendored third-party headers are kept verbatim (upstream formatting).
        exclude: '^third_party/'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: local
    hooks:
      # Closure (Release wasm only) renames unquoted properties, so a plain
      # `Module.HEAPU8` in an EM_JS body silently becomes a dangling `h.$c`.
      # Nothing else in the build sees this: RelWithDebInfo skips Closure and
      # the failure surfaces only when that handler runs in a browser.
      - id: em-js-closure
        name: quoted Module[...] access in EM_JS
        entry: scripts/check_em_js_closure.py
        language: python
        types_or: [c++, c]
        exclude: '^third_party/'

      # The command sources compile into libnodehammer now, so a `std::exit`
      # among them ends whatever called `cli::run` -- for the Python bindings,
      # the interpreter. Removing the 21 that were there was the bulk of the
      # work; nothing in the type system stops the twenty-second, and it would
      # look exactly like the code that used to be correct.
      - id: cli-no-exit
        name: no process-terminating calls under src/cli
        entry: scripts/check_cli_no_exit.py
        language: python
        files: '^src/cli/.*\.(c|cc|cpp|cxx|h|hpp|hxx)$'
