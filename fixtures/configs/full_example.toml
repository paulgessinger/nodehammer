# Full nodehammer config example.

[materials.aluminum]
base_color = [0.75, 0.75, 0.85, 1.0]
metallic = 0.1
roughness = 0.4

[materials.copper]
base_color = [0.72, 0.45, 0.20, 1.0]
metallic = 0.9
roughness = 0.2

[[selection_rules]]
scope = "/World/Tracker/**"
[selection_rules.keep_if]
type = "name_glob"
pattern = "*Tracker*"

[[selection_rules]]
[selection_rules.drop_if]
type = "tag"
key = "sensitive"
value = "false"

[[selection_rules]]
[selection_rules.keep_if]
type = "and"
operands = [
  {type = "name_glob", pattern = "*Silicon*"},
  {type = "is_leaf"},
]

# Unified rules: material + tessellation + extras in one list.
[[rules]]
match = 'path ~= "/World/Tracker/**" && tag.semantic == "sensor"'
material = "aluminum"

[[rules]]
match = 'path ~= "/World/Tracker/BeamPipe/**"'
material = "copper"

[[rules]]
match = 'path ~= "/World/Tracker/**"'
[rules.tessellation]
max_segments_circle = 32
fallback = "skip"
[rules.extras]
visible = true

[[rules]]
[rules.tessellation]
max_segments_circle = 64
fallback = "skip"
