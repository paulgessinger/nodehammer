# MDI_o1_CADBased_v01 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/MDI/compact/MDI_o1_CADBased_v01/MDI_standalone_o1_v01.xml
# Use with analysis/fccee/geometry/MDI_o1_CADBased_v01.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# Detailed: retain all placements and material layers; no merging or face removal.
# Suppress non-sensitive air/vacuum and synthetic assembly boxes, not their children.

hoist_orphans = false
deduplicate_shapes = true

[materials.vertex]
base_color = "#E6B422"
metallic = 0.15
roughness = 0.55

[materials.tracker]
base_color = "#33B8B0"
metallic = 0.15
roughness = 0.55

[materials.drift]
base_color = "#65C7C2"
metallic = 0.15
roughness = 0.55

[materials.ecal]
base_color = "#E65B50"
metallic = 0.15
roughness = 0.55

[materials.hcal]
base_color = "#A75CB3"
metallic = 0.15
roughness = 0.55

[materials.muon]
base_color = "#527ED1"
metallic = 0.15
roughness = 0.55

[materials.magnet]
base_color = "#85919E"
metallic = 0.15
roughness = 0.55

[materials.beam]
base_color = "#ADB5BD"
metallic = 0.15
roughness = 0.55

[materials.other]
base_color = "#8EAD88"
metallic = 0.15
roughness = 0.55

[materials.silicon]
base_color = "#52B8A8"
metallic = 0.35
roughness = 0.35

[materials.metal]
base_color = "#A9AFB8"
metallic = 0.8
roughness = 0.4

[materials.carbon]
base_color = "#414852"
metallic = 0.15
roughness = 0.7

[materials.scintillator]
base_color = "#ED9D45"
roughness = 0.5

[materials.gas]
base_color = "#68BCC218"
alpha_mode = "blend"
roughness = 0.7

[export.gltf]
unit_scale = 0.01
bake_unit_scale = true

[export.obj]
unit_scale = 0.01

[defaults.tessellation]
max_segments_circle = 64
fallback = "fail"
merge_descendants = false
drop_coincident_faces = false
average_material_stack = false

[[selection_rules]]
keep_if = 'true'

[[rules]]
match = 'path ~= "/world/Beampipe_STL" || path ~= "/world/Beampipe_STL/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/Beampipe_crotch_STL" || path ~= "/world/Beampipe_crotch_STL/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/Gold_STL" || path ~= "/world/Gold_STL/**"'
material = "other"

[[rules]]
match = 'path ~= "/world/Paraffin_STL" || path ~= "/world/Paraffin_STL/**"'
material = "other"

[[rules]]
match = 'path ~= "/world/Water_STL" || path ~= "/world/Water_STL/**"'
material = "other"

[[rules]]
match = 'path ~= "/world/Tungsten_STL" || path ~= "/world/Tungsten_STL/**"'
material = "other"

[[rules]]
match = 'path ~= "/world/CompSol" || path ~= "/world/CompSol/**"'
material = "magnet"

[[rules]]
match = 'path ~= "/world/ScreenSol" || path ~= "/world/ScreenSol/**"'
material = "magnet"

[[rules]]
match = 'path ~= "/world/QC1" || path ~= "/world/QC1/**"'
material = "other"

[[rules]]
match = [
  'material ~= "AlBeMet162"',
  'material ~= "Copper"',
  'material ~= "Gold"',
  'material ~= "Tungsten"',
]
material = "metal"

[[rules]]
match = 'path ~= "/world" || ((material ~= "Air" || material ~= "dummy") && !(tag.sensitive == "true"))'
[rules.tessellation]
skip_geometry = true
