# IDEA_o1_v03 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/IDEA/compact/IDEA_o1_v03/IDEA_o1_v03.xml
# Use with analysis/fccee/geometry/IDEA_o1_v03.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# Suppress non-sensitive air/vacuum and synthetic assembly boxes, not their children.

# Detailed: material-based appearance; retain supports and material layers.
include = ["../physical-materials.toml", "../idea-drift.toml"]

hoist_orphans = false
deduplicate_shapes = true

[export.gltf]
unit_scale = 0.01
bake_unit_scale = true

[export.obj]
unit_scale = 0.01

[defaults.tessellation]
max_segments_circle = 64
fallback = "fail"
merge_descendants = false
drop_coincident_faces = false
average_material_stack = false

[[selection_rules]]
keep_if = 'true'

[[rules]]
match = 'path ~= "/world" || ((material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy") && !(tag.sensitive == "true"))'
[rules.tessellation]
skip_geometry = true

# Retain the positioned copper towers and silicon readout wafers, as o2 retains
# its brass towers. Drop fibre/capillary detail below these display boundaries.
[[selection_rules]]
drop_if = 'path ~= "/world/DRcalo/AssemblyTube_*/*/**"'

# The two assembly envelopes overlap the tower contents; keep only their hierarchy.
[[rules]]
match = 'path ~= "/world/DRcalo/AssemblyTube_*"'
[rules.tessellation]
skip_geometry = true
