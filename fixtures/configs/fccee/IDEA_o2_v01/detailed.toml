# IDEA_o2_v01 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/IDEA/compact/IDEA_o2_v01/IDEA_o2_v01.xml
# Use with analysis/fccee/geometry/IDEA_o2_v01.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# Suppress non-sensitive air/vacuum and synthetic assembly boxes, not their children.

# Detailed: material-based appearance; retain supports and material layers.
include = ["../physical-materials.toml", "../idea-drift.toml"]

hoist_orphans = false
deduplicate_shapes = true

[export.gltf]
unit_scale = 0.01
bake_unit_scale = true

[export.obj]
unit_scale = 0.01

[defaults.tessellation]
max_segments_circle = 64
fallback = "fail"
merge_descendants = false
drop_coincident_faces = false
average_material_stack = false

[[selection_rules]]
keep_if = 'true'

[[rules]]
match = 'path ~= "/world" || ((material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy") && !(tag.sensitive == "true"))'
[rules.tessellation]
skip_geometry = true

# Calorimeter internals are intentionally omitted, including on full CI inputs.
# Retain positioned tower solids; exclude their capillaries, air and fibres.
[[selection_rules]]
drop_if = [
  'path ~= "/world/DREndcapTubes/phiER_*/towerLog_*/**"',
  'path ~= "/world/DRBarrelTubes/stave_volume_*/tower_*/**"',
]

[[rules]]
match = [
  'path ~= "/world/DRBarrelTubes/stave_volume_*/tower_*"',
  'path ~= "/world/DREndcapTubes/phiER_*/towerLog_*"',
]
material = "brass"
[rules.tessellation]
skip_geometry = false

# Replace dense crystal-cell assemblies with fitted polyhedral envelopes.
# This keeps their sector outlines while bounding cut/tessellation cost.
[[rules]]
match = 'name ~= "barrelPhiAssembly_*" || name ~= "endcapPhiVol*" || name ~= "timingPhiAssembly_*" || name ~= "tlendcapPhiVol*"'
material = "glass"
[rules.geometry]
replace_descendants = "convex_hull"

# Parent assembly boxes span empty regions and overlap the opposite calorimeter
# section. Render the smaller towers above, leaving these containers hidden.
[[rules]]
match = 'path ~= "/world/DREndcapTubes/phiER_*" || path ~= "/world/DRBarrelTubes/stave_volume_*"'
[rules.tessellation]
skip_geometry = true
