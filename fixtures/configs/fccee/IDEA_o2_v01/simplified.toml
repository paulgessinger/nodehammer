# IDEA_o2_v01 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/IDEA/compact/IDEA_o2_v01/IDEA_o2_v01.xml
# Use with analysis/fccee/geometry/IDEA_o2_v01.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# PARTIAL GEOMETRY: large dual-readout calorimeter internals intentionally omitted.
# Tagged retained envelopes are proxies. Detailed means all remaining imported parts.
# See analysis/fccee/IDEA_o2_v01.omissions.json and FOLLOW_UP.txt.
# Simplified: sensitive silicon tracker placements, calorimeter/muon/drift envelopes,
# and physical beam-line parts. Envelopes are display proxies, not material-budget models.
# Fine calorimeter sampling, tracker support/services, wires and straws are omitted.

hoist_orphans = true
deduplicate_shapes = true

[materials.vertex]
base_color = "#E6B422"
metallic = 0.15
roughness = 0.55

[materials.tracker]
base_color = "#33B8B0"
