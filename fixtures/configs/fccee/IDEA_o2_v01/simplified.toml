# Retain actual sensor and beam-line solids; no synthetic assembly boxes.
[[rules]]
match = [
  'path ~= "/world/Vertex/**" && tag.sensitive == "true"',
  'path ~= "/world/SiWrB/**" && tag.sensitive == "true"',
  'path ~= "/world/SiWrD/**" && tag.sensitive == "true"',
  '(path ~= "/world/BeBeampipe" || path ~= "/world/BeBeampipe/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/BeamPipe" || path ~= "/world/BeamPipe/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/SynchRadMask" || path ~= "/world/SynchRadMask/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/BeamPipeShield" || path ~= "/world/BeamPipeShield/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/BeamPipeShield_noRot" || path ~= "/world/BeamPipeShield_noRot/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/LumiCalInstrumentation" || path ~= "/world/LumiCalInstrumentation/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/LumiCalCooling" || path ~= "/world/LumiCalCooling/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/LumiCalBackShield" || path ~= "/world/LumiCalBackShield/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
]
[rules.tessellation]
skip_geometry = false
