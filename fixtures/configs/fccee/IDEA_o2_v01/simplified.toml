# IDEA_o2_v01 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/IDEA/compact/IDEA_o2_v01/IDEA_o2_v01.xml
# Use with analysis/fccee/geometry/IDEA_o2_v01.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# Simplified: sensitive silicon tracker placements, calorimeter/muon/drift envelopes,
# and physical beam-line parts. Envelopes are display proxies, not material-budget models.
# Fine calorimeter sampling, tracker support/services, wires and straws are omitted.

hoist_orphans = true
deduplicate_shapes = true

[materials.vertex]
base_color = "#E6B422"
metallic = 0.0
roughness = 0.65

[materials.tracker]
base_color = "#33B8B0"
metallic = 0.0
roughness = 0.65

[materials.drift]
base_color = "#65C7C2"
metallic = 0.0
roughness = 0.65

[materials.ecal]
base_color = "#E65B50"
metallic = 0.0
roughness = 0.65

[materials.hcal]
base_color = "#A75CB3"
metallic = 0.0
roughness = 0.65

[materials.muon]
base_color = "#527ED1"
metallic = 0.0
roughness = 0.65

[materials.magnet]
base_color = "#85919E"
metallic = 0.0
roughness = 0.65

[materials.beam]
base_color = "#ADB5BD"
metallic = 0.0
roughness = 0.65

[materials.other]
base_color = "#8EAD88"
metallic = 0.0
roughness = 0.65

[export.gltf]
unit_scale = 0.01
bake_unit_scale = true

[export.obj]
unit_scale = 0.01

[defaults.tessellation]
max_segments_circle = 24
fallback = "fail"
skip_geometry = true

[[selection_rules]]
drop_if = 'true'

# Keep subsystem headings to preserve a useful selection tree.
[[selection_rules]]
keep_if = [
  'path ~= "/world"',
  'path ~= "/world/BeBeampipe"',
  'path ~= "/world/BeamPipe"',
  'path ~= "/world/SynchRadMask"',
  'path ~= "/world/BeamPipeShield"',
  'path ~= "/world/BeamPipeShield_noRot"',
  'path ~= "/world/CompSol"',
  'path ~= "/world/ScreenSol"',
  'path ~= "/world/LumiCal"',
  'path ~= "/world/LumiCalInstrumentation"',
  'path ~= "/world/LumiCalCooling"',
  'path ~= "/world/LumiCalBackShield"',
  'path ~= "/world/Vertex"',
  'path ~= "/world/DCH_v2"',
  'path ~= "/world/SiWrB"',
  'path ~= "/world/SiWrD"',
  'path ~= "/world/Solenoid"',
  'path ~= "/world/EndPlateAbsorber_positive"',
  'path ~= "/world/EndPlateAbsorber_negative"',
  'path ~= "/world/SCEPCal_MainLayer"',
  'path ~= "/world/endcapGlobalAssemblyVol_19"',
  'path ~= "/world/endcapGlobalAssemblyVol_1_20"',
  'path ~= "/world/SCEPCal_TimingLayer"',
  'path ~= "/world/tlendcapGlobalAssemblyVol_22"',
  'path ~= "/world/tlendcapGlobalAssemblyVol_1_23"',
  'path ~= "/world/DREndcapTubes"',
  'path ~= "/world/DRBarrelTubes"',
  'path ~= "/world/Muon-System"',
]

[[selection_rules]]
keep_if = [
  'path ~= "/world/CompSol/tube_CompSol_0"',
  'path ~= "/world/CompSol/tube_CompSol_1"',
  'path ~= "/world/ScreenSol/tube_CompSol_0"',
  'path ~= "/world/ScreenSol/tube_CompSol_1"',
  'path ~= "/world/ScreenSol/tube_CompSol_2"',
  'path ~= "/world/ScreenSol/tube_CompSol_3"',
  'path ~= "/world/LumiCal"',
  'path ~= "/world/DCH_v2"',
  'path ~= "/world/Solenoid"',
  'path ~= "/world/EndPlateAbsorber_positive"',
  'path ~= "/world/EndPlateAbsorber_negative"',
  'path ~= "/world/SCEPCal_MainLayer"',
  'path ~= "/world/endcapGlobalAssemblyVol_19"',
  'path ~= "/world/endcapGlobalAssemblyVol_1_20"',
  'path ~= "/world/SCEPCal_TimingLayer"',
  'path ~= "/world/tlendcapGlobalAssemblyVol_22"',
  'path ~= "/world/tlendcapGlobalAssemblyVol_1_23"',
  'path ~= "/world/DRBarrelTubes"',
  'path ~= "/world/Muon-System"',
  'path ~= "/world/BeBeampipe" || path ~= "/world/BeBeampipe/**"',
  'path ~= "/world/BeamPipe" || path ~= "/world/BeamPipe/**"',
  'path ~= "/world/SynchRadMask" || path ~= "/world/SynchRadMask/**"',
  'path ~= "/world/BeamPipeShield" || path ~= "/world/BeamPipeShield/**"',
  'path ~= "/world/BeamPipeShield_noRot" || path ~= "/world/BeamPipeShield_noRot/**"',
  'path ~= "/world/LumiCalInstrumentation" || path ~= "/world/LumiCalInstrumentation/**"',
  'path ~= "/world/LumiCalCooling" || path ~= "/world/LumiCalCooling/**"',
  'path ~= "/world/LumiCalBackShield" || path ~= "/world/LumiCalBackShield/**"',
  'path ~= "/world/Vertex/**" && tag.sensitive == "true"',
  'path ~= "/world/SiWrB/**" && tag.sensitive == "true"',
  'path ~= "/world/SiWrD/**" && tag.sensitive == "true"',
]

# Conceptual palette: subsystem assignments override this neutral fallback.
[[rules]]
material = "other"

[[rules]]
match = 'path ~= "/world/BeBeampipe" || path ~= "/world/BeBeampipe/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/BeamPipe" || path ~= "/world/BeamPipe/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/SynchRadMask" || path ~= "/world/SynchRadMask/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/BeamPipeShield" || path ~= "/world/BeamPipeShield/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/BeamPipeShield_noRot" || path ~= "/world/BeamPipeShield_noRot/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/CompSol" || path ~= "/world/CompSol/**"'
material = "magnet"

[[rules]]
match = 'path ~= "/world/ScreenSol" || path ~= "/world/ScreenSol/**"'
material = "magnet"

[[rules]]
match = 'path ~= "/world/LumiCal" || path ~= "/world/LumiCal/**"'
material = "ecal"

[[rules]]
match = 'path ~= "/world/LumiCalInstrumentation" || path ~= "/world/LumiCalInstrumentation/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/LumiCalCooling" || path ~= "/world/LumiCalCooling/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/LumiCalBackShield" || path ~= "/world/LumiCalBackShield/**"'
material = "beam"

[[rules]]
match = 'path ~= "/world/Vertex" || path ~= "/world/Vertex/**"'
material = "vertex"

[[rules]]
match = 'path ~= "/world/DCH_v2" || path ~= "/world/DCH_v2/**"'
material = "drift"

[[rules]]
match = 'path ~= "/world/SiWrB" || path ~= "/world/SiWrB/**"'
material = "tracker"

[[rules]]
match = 'path ~= "/world/SiWrD" || path ~= "/world/SiWrD/**"'
material = "tracker"

[[rules]]
match = 'path ~= "/world/Solenoid" || path ~= "/world/Solenoid/**"'
material = "magnet"

[[rules]]
match = 'path ~= "/world/EndPlateAbsorber_positive" || path ~= "/world/EndPlateAbsorber_positive/**"'
material = "other"

[[rules]]
match = 'path ~= "/world/EndPlateAbsorber_negative" || path ~= "/world/EndPlateAbsorber_negative/**"'
material = "other"

[[rules]]
match = 'path ~= "/world/SCEPCal_MainLayer" || path ~= "/world/SCEPCal_MainLayer/**"'
material = "ecal"

[[rules]]
match = 'path ~= "/world/endcapGlobalAssemblyVol_19" || path ~= "/world/endcapGlobalAssemblyVol_19/**"'
material = "ecal"

[[rules]]
match = 'path ~= "/world/endcapGlobalAssemblyVol_1_20" || path ~= "/world/endcapGlobalAssemblyVol_1_20/**"'
material = "ecal"

[[rules]]
match = 'path ~= "/world/SCEPCal_TimingLayer" || path ~= "/world/SCEPCal_TimingLayer/**"'
material = "ecal"

[[rules]]
match = 'path ~= "/world/tlendcapGlobalAssemblyVol_22" || path ~= "/world/tlendcapGlobalAssemblyVol_22/**"'
material = "ecal"

[[rules]]
match = 'path ~= "/world/tlendcapGlobalAssemblyVol_1_23" || path ~= "/world/tlendcapGlobalAssemblyVol_1_23/**"'
material = "ecal"

[[rules]]
match = 'path ~= "/world/DREndcapTubes" || path ~= "/world/DREndcapTubes/**"'
material = "hcal"

[[rules]]
match = 'path ~= "/world/DRBarrelTubes" || path ~= "/world/DRBarrelTubes/**"'
material = "hcal"

[[rules]]
match = 'path ~= "/world/Muon-System" || path ~= "/world/Muon-System/**"'
material = "muon"

# Render these exact, observed envelope solids.
[[rules]]
match = [
  'path ~= "/world/CompSol/tube_CompSol_0"',
  'path ~= "/world/CompSol/tube_CompSol_1"',
  'path ~= "/world/ScreenSol/tube_CompSol_0"',
  'path ~= "/world/ScreenSol/tube_CompSol_1"',
  'path ~= "/world/ScreenSol/tube_CompSol_2"',
  'path ~= "/world/ScreenSol/tube_CompSol_3"',
  'path ~= "/world/LumiCal"',
  'path ~= "/world/DCH_v2"',
  'path ~= "/world/Solenoid"',
  'path ~= "/world/EndPlateAbsorber_positive"',
  'path ~= "/world/EndPlateAbsorber_negative"',
  'path ~= "/world/SCEPCal_MainLayer"',
  'path ~= "/world/endcapGlobalAssemblyVol_19"',
  'path ~= "/world/endcapGlobalAssemblyVol_1_20"',
  'path ~= "/world/SCEPCal_TimingLayer"',
  'path ~= "/world/tlendcapGlobalAssemblyVol_22"',
  'path ~= "/world/tlendcapGlobalAssemblyVol_1_23"',
  'path ~= "/world/DRBarrelTubes"',
  'path ~= "/world/Muon-System"',
]
[rules.tessellation]
skip_geometry = false

# Retain actual sensor and beam-line solids; no synthetic assembly boxes.
[[rules]]
match = [
  'path ~= "/world/Vertex/**" && tag.sensitive == "true"',
  'path ~= "/world/SiWrB/**" && tag.sensitive == "true"',
  'path ~= "/world/SiWrD/**" && tag.sensitive == "true"',
  '(path ~= "/world/BeBeampipe" || path ~= "/world/BeBeampipe/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/BeamPipe" || path ~= "/world/BeamPipe/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/SynchRadMask" || path ~= "/world/SynchRadMask/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/BeamPipeShield" || path ~= "/world/BeamPipeShield/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/BeamPipeShield_noRot" || path ~= "/world/BeamPipeShield_noRot/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/LumiCalInstrumentation" || path ~= "/world/LumiCalInstrumentation/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/LumiCalCooling" || path ~= "/world/LumiCalCooling/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
  '(path ~= "/world/LumiCalBackShield" || path ~= "/world/LumiCalBackShield/**") && !(material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy")',
]
[rules.tessellation]
skip_geometry = false

# Endcap assembly bounding boxes are centred on the beam axis and overlap into
# a solid disc. They are not physical endcap solids; hide these false proxies.
[[rules]]
match = 'path ~= "/world/DREndcapTubes/phiER_*"'
[rules.tessellation]
skip_geometry = true
