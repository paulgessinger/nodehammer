# ILD_FCCee_v01 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/ILD_FCCee/compact/ILD_FCCee_v01/ILD_FCCee_v01.xml
# Use with analysis/fccee/geometry/ILD_FCCee_v01.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# Simplified: sensitive silicon tracker placements, calorimeter/muon/drift envelopes,
# and physical beam-line parts. Envelopes are display proxies, not material-budget models.
# Fine calorimeter sampling, tracker support/services, wires and straws are omitted.

