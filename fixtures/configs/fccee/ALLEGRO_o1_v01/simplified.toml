  'path ~= "/world/HOMAbsorber"',
  'path ~= "/world/HOMAbsorbers_PunchThrough"',
  'path ~= "/world/Vertex"',
  'path ~= "/world/CDCH"',
  'path ~= "/world/ECalBarrel"',
  'path ~= "/world/HCalBarrel"',
  'path ~= "/world/CalEndcapCryoFront_positive"',
