# ALLEGRO_o1_v01 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/ALLEGRO/compact/ALLEGRO_o1_v01/ALLEGRO_o1_v01.xml
# Use with analysis/fccee/geometry/ALLEGRO_o1_v01.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# Simplified: sensitive silicon tracker placements, calorimeter/muon/drift envelopes,
# and physical beam-line parts. Envelopes are display proxies, not material-budget models.
# Fine calorimeter sampling, tracker support/services, wires and straws are omitted.

hoist_orphans = true
deduplicate_shapes = true

[materials.vertex]
base_color = "#E6B422"
metallic = 0.0
roughness = 0.65

[materials.tracker]
base_color = "#33B8B0"
metallic = 0.0
roughness = 0.65

[materials.drift]
base_color = "#65C7C2"
metallic = 0.0
roughness = 0.65

[materials.ecal]
base_color = "#E65B50"
metallic = 0.0
roughness = 0.65

[materials.hcal]
base_color = "#A75CB3"
metallic = 0.0
roughness = 0.65

[materials.muon]
base_color = "#527ED1"
metallic = 0.0
roughness = 0.65

[materials.magnet]
base_color = "#85919E"
metallic = 0.0
roughness = 0.65

[materials.beam]
base_color = "#ADB5BD"
metallic = 0.0
roughness = 0.65

[materials.other]
base_color = "#8EAD88"
metallic = 0.0
roughness = 0.65

[export.gltf]
unit_scale = 0.01
bake_unit_scale = true

[export.obj]
unit_scale = 0.01

[defaults.tessellation]
max_segments_circle = 24
fallback = "fail"
skip_geometry = true

[[selection_rules]]
drop_if = 'true'

# Keep subsystem headings to preserve a useful selection tree.
[[selection_rules]]
keep_if = [
  'path ~= "/world"',
  'path ~= "/world/BeBeampipe"',
  'path ~= "/world/BeamPipe"',
  'path ~= "/world/BeamPipeShield"',
