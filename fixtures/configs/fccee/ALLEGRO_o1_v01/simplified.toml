  'path ~= "/world/LumiCal"',
  'path ~= "/world/CDCH"',
  'path ~= "/world/ECalBarrel"',
  'path ~= "/world/HCalBarrel"',
  'path ~= "/world/CalEndcapCryoFront_positive"',
