# ALLEGRO_o1_v01 — k4geo 00-24 (Key4hep 2026-04-08)
# Source: FCCee/ALLEGRO/compact/ALLEGRO_o1_v01/ALLEGRO_o1_v01.xml
# Use with analysis/fccee/geometry/ALLEGRO_o1_v01.nhb.zst.
# ROOT/DD4hep native length unit in this build is cm; exports below use metres.
# Suppress non-sensitive air/vacuum and synthetic assembly boxes, not their children.

# Detailed: material-based appearance; retain supports and material layers.
include = "../physical-materials.toml"

hoist_orphans = false
deduplicate_shapes = true

[export.gltf]
unit_scale = 0.01
bake_unit_scale = true

[export.obj]
unit_scale = 0.01

[defaults.tessellation]
# Smooth cylindrical facets while retaining sharp sampling and cut edges.
shading = "smooth"
smooth_angle = 30
max_segments_circle = 64
fallback = "fail"
merge_descendants = false
drop_coincident_faces = false
average_material_stack = false

[[selection_rules]]
keep_if = 'true'

[[rules]]
match = 'path ~= "/world" || ((material ~= "Air" || material ~= "Vacuum" || material ~= "beam" || material ~= "dummy") && !(tag.sensitive == "true"))'
[rules.tessellation]
skip_geometry = true

# Omit the gas-only drift shells and the liquid bath enclosing the ECAL plates.
# Keep physical calorimeter layers, services and cryostat walls.
[[rules]]
match = 'volume ~= "CDCHlayer*" || volume ~= "LAr_bath*"'
[rules.tessellation]
skip_geometry = true

# Volume globs also match the _wedgecut variants generated by viewing cuts.
# Merge repeated sampling units, preserving their individual material finishes.
# A merge replaces its mother's solid with the visible descendant surfaces.
[[rules]]
match = 'volume ~= "HCalTileSequenceVol*" || volume ~= "HCalECTileSequenceVol*" || (path ~= "/world/ECalBarrel/**" && volume ~= "passive*") || volume ~= "layerEnvelope*"'
[rules.tessellation]
skip_geometry = false
merge_descendants = true
drop_coincident_faces = true

# Do not average annular HCAL stacks: that option also builds convex-hull LOD
# proxies, which fill their beam opening. Retain the detailed annular meshes.

# Active barrel ECAL cells are air mothers containing twelve LAr slices.
[[rules]]
match = 'path ~= "/world/ECalBarrel/**" && volume ~= "active*"'
[rules.tessellation]
skip_geometry = false
merge_descendants = true
drop_coincident_faces = true
average_material_stack = true

# Bound repeated cylindrical sampling geometry; keep ECAL/cryostat resolution.
[[rules]]
match = 'path ~= "/world/HCalBarrel/**" || path ~= "/world/HCalThreePartsEndcap/**"'
[rules.tessellation]
max_segments_circle = 32

# Opaque display finish for repeated liquid sampling slices: avoid thousands
# of overlapping transparent surfaces and order-dependent compositing.
[materials.lar_display]
base_color = "#8CAEB8"
metallic = 0
roughness = 0.8

[[rules]]
match = 'material == "LAr"'
material = "lar_display"
