# ODD material definitions and source-material mapping rules.

# ── Render material definitions ──────────────────────────────────────────────

[materials.pixel]
base_color = [0.8, 0.1, 0.1, 1.0]
metallic = 0.9
roughness = 0.3

[materials.short_strip]
base_color = [0.1, 0.8, 0.1, 1.0]
metallic = 0.9
roughness = 0.3

[materials.long_strip]
base_color = [0.1, 0.1, 0.8, 1.0]
metallic = 0.9
roughness = 0.3

[materials.ecal]
base_color = [0.9, 0.7, 0.1, 1.0]
metallic = 0.2
roughness = 0.6

[materials.hcal]
base_color = [0.2, 0.7, 0.7, 1.0]
metallic = 0.2
roughness = 0.6

[materials.muon]
base_color = [0.7, 0.4, 0.9, 1.0]
metallic = 0.3
roughness = 0.5

[materials.support]
base_color = [0.5, 0.5, 0.5, 1.0]
metallic = 0.0
roughness = 0.7

[materials.silicon]
base_color = [0.2, 0.4, 0.9, 1.0]
metallic = 0.8
roughness = 0.2

[materials.kapton]
base_color = [0.9, 0.6, 0.1, 1.0]
metallic = 0.0
roughness = 0.6

[materials.aluminum]
base_color = [0.85, 0.85, 0.9, 1.0]
metallic = 1.0
roughness = 0.3

[materials.carbon_fiber]
# base_color = "#ff0000"
base_color = "#BA7B31FF"
metallic = 0.3
roughness = 0.4

[materials.titanium]
base_color = [0.6, 0.55, 0.5, 1.0]
metallic = 0.9
roughness = 0.35

# ── Source-material → render-material mapping rules ──────────────────────────

[[rules]]
match = 'material ~= "Silicon"'
material = "silicon"

[[rules]]
match = 'material ~= "Kapton"'
material = "kapton"

[[rules]]
match = 'material ~= "Aluminum"'
material = "aluminum"

[[rules]]
match = 'material ~= "CarbonFiber*"'
material = "carbon_fiber"

[[rules]]
match = 'material ~= "Titanium"'
material = "titanium"
