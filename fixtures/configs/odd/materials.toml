# ODD material definitions and source-material mapping rules.

# ── Render material definitions ──────────────────────────────────────────────

[materials.pixel]
base_color = [0.8, 0.1, 0.1, 1.0]
metallic = 0.9
roughness = 0.3

[materials.short_strip]
base_color = [0.1, 0.8, 0.1, 1.0]
metallic = 0.9
roughness = 0.3

[materials.long_strip]
base_color = [0.1, 0.1, 0.8, 1.0]
metallic = 0.9
roughness = 0.3

[materials.ecal]
base_color = [0.9, 0.7, 0.1, 1.0]
metallic = 0.2
roughness = 0.6

[materials.hcal]
base_color = [0.2, 0.7, 0.7, 1.0]
metallic = 0.2
roughness = 0.6

[materials.muon]
base_color = [0.7, 0.4, 0.9, 1.0]
metallic = 0.3
roughness = 0.5

[materials.support]
base_color = [0.5, 0.5, 0.5, 1.0]
metallic = 0.0
roughness = 0.7

[materials.silicon]
base_color = "#60666E"
metallic = 1.0
roughness = 0.05

[materials.kapton]
base_color = "#9A5516"
metallic = 0.0
roughness = 0.16
ior = 1.70
transmission = 0.85
clearcoat = 0.1

[materials.aluminum]
base_color = "#C8C8C8"
metallic = 1.0
roughness = 0.12

[materials.carbon_fiber]
base_color = "#1A1A1A"
metallic = 0.0
roughness = 0.32
specular = 0.60
anisotropy = 0.35
clearcoat = 0.20
clearcoat_roughness = 0.08

[materials.titanium]
base_color = "#9A9DA3"
metallic = 1.0
roughness = 0.28

[materials.carbon_foam]
base_color = [0.08, 0.08, 0.08]
metallic = 0.0
roughness = 0.92

[materials.copper]
base_color = "#B87333"
metallic = 1.0
roughness = 0.25

# ── Source-material → render-material mapping rules ──────────────────────────

[[rules]]
match = 'material ~= "Silicon"'
material = "silicon"

[[rules]]
match = 'material ~= "Kapton"'
material = "kapton"

[[rules]]
match = 'material ~= "Aluminum"'
material = "aluminum"

[[rules]]
match = 'material ~= "CarbonFiber*"'
material = "carbon_fiber"

[[rules]]
match = 'material ~= "Titanium"'
material = "titanium"

[[rules]]
match = 'material ~= "CarbonFoam"'
material = "carbon_foam"

[[rules]]
match = 'material ~= "Copper"'
material = "copper"
