# ODD material definitions and source-material mapping rules.

# ── Render material definitions ──────────────────────────────────────────────

[materials.beryllium]
base_color = "#A8A8A0"
metallic = 0.8
roughness = 0.2

[materials.support]
base_color = [0.5, 0.5, 0.5, 1.0]
metallic = 0.0
roughness = 0.7

[materials.silicon]
base_color = "#60666E"
metallic = 1.0
roughness = 0.05

[materials.kapton]
base_color = "#9A5516"
metallic = 0.0
roughness = 0.16
ior = 1.70
transmission = 0.85
clearcoat = 0.1

[materials.aluminum]
base_color = "#C8C8C8"
metallic = 1.0
roughness = 0.12

[materials.carbon_fiber]
base_color = "#1A1A1A"
metallic = 0.0
roughness = 0.32
specular = 0.60
anisotropy = 0.35
clearcoat = 0.20
clearcoat_roughness = 0.08

[materials.titanium]
base_color = "#9A9DA3"
metallic = 1.0
roughness = 0.28

[materials.carbon_foam]
base_color = [0.08, 0.08, 0.08]
metallic = 0.0
roughness = 0.92

[materials.copper]
base_color = "#B66A3C"
metallic = 1.0
roughness = 0.18

[materials.tungsten_dens24]
base_color = "#808078"
metallic = 1.0
roughness = 0.50
specular = 0.50
anisotropy = 0.0
clearcoat = 0.0
clearcoat_roughness = 0.0

[materials.g10]
base_color = "#B5A85A"
metallic = 0.0
roughness = 0.65
specular = 0.30

[materials.ground_or_hv_mix]
base_color = "#A0623A"
metallic = 1.0
roughness = 0.55
specular = 0.55

[materials.si_pcb_mix]
base_color = "#966050"
metallic = 0.85
roughness = 0.60
specular = 0.50

# ── Source-material → render-material mapping rules ──────────────────────────

[[rules]]
match = 'material ~= "Beryllium"'
material = "beryllium"

[[rules]]
match = 'material ~= "Silicon"'
material = "silicon"

[[rules]]
match = 'material ~= "Kapton"'
material = "kapton"

[[rules]]
match = 'material ~= "Aluminum"'
material = "aluminum"

[[rules]]
match = 'material ~= "CarbonFiber*"'
material = "carbon_fiber"

[[rules]]
match = 'material ~= "Titanium"'
material = "titanium"

[[rules]]
match = 'material ~= "CarbonFoam"'
material = "carbon_foam"

[[rules]]
match = 'material ~= "Copper"'
material = "copper"

[[rules]]
match = 'material ~= "TungstenDens24"'
material = "tungsten_dens24"

[[rules]]
match = 'material ~= "G10"'
material = "g10"

[[rules]]
match = 'material ~= "GroundOrHvMix"'
material = "ground_or_hv_mix"

[[rules]]
match = 'material ~= "SiPcbMix"'
material = "si_pcb_mix"
