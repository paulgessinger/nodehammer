# ODD tracker: pixels, short strips, long strips

# ── Selection ────────────────────────────────────────────────────────────────

[[selection_rules]]
keep_if = [
  'path ~= "**/Pixels"',
  'path ~= "**/Pixels/*Barrel"',
  'path ~= "**/Pixels/*EndcapN"',
  'path ~= "**/Pixels/*EndcapP"',
  'path ~= "**/ShortStrips"',
  'path ~= "**/ShortStrips/*Barrel"',
  'path ~= "**/ShortStrips/*EndcapN"',
  'path ~= "**/ShortStrips/*EndcapP"',
  'path ~= "**/LongStrips"',
  'path ~= "**/LongStrips/*Barrel"',
  'path ~= "**/LongStrips/*EndcapN"',
  'path ~= "**/LongStrips/*EndcapP"',
]


# Keep stave nodes and all their leaf descendants.
[[selection_rules]]
keep_if = [
  'path ~= "**/PixelLayer*"',
  'path ~= "**/PixelLayer*/stave*"',
  'path ~= "**/PixelLayer*/stave*/**" && is_leaf',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/ShortStripLayer*"',
  'path ~= "**/ShortStripLayer*/stave*"',
  'path ~= "**/ShortStripLayer*/stave*/**" && is_leaf',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/LongStripLayer*"',
  'path ~= "**/LongStripLayer*/stave*"',
  'path ~= "**/LongStripLayer*/stave*/**" && is_leaf',
]


# ── Rules ────────────────────────────────────────────────────────────────────

# Structural nodes: no geometry.

[[rules]]
match = [
  'path ~= "**/Pixels"',
  'path ~= "**/Pixels/*Barrel"',
  'path ~= "**/PixelLayer*"',
  'path ~= "**/Pixels/*EndcapN"',
  'path ~= "**/Pixels/*EndcapP"',

  'path ~= "**/ShortStrips"',
  'path ~= "**/ShortStrips/*Barrel"',
  'path ~= "**/ShortStripLayer*"',
  'path ~= "**/ShortStrips/*EndcapN"',
  'path ~= "**/ShortStrips/*EndcapP"',

  'path ~= "**/LongStrips"',
  'path ~= "**/LongStrips/*Barrel"',
  'path ~= "**/LongStripLayer*"',
  'path ~= "**/LongStrips/*EndcapN"',
  'path ~= "**/LongStrips/*EndcapP"',
]
[rules.tessellation]
skip_geometry = true

# Barrel/endcap/stave nodes: merge descendants.
[[rules]]
match = [
  'path ~= "**/PixelLayer*/stave*"',
  'path ~= "**/ShortStripLayer*/stave*"',
  'path ~= "**/LongStripLayer*/stave*"',
]

[rules.tessellation]
merge_descendants = true
max_segments_circle = 10
fallback = "skip"

[rules.extras]
visible = true
opacity = 1.0
