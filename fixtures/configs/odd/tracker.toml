# ODD tracker: pixels, short strips, long strips

# ── Selection ────────────────────────────────────────────────────────────────

[[selection_rules]]
keep_if = [
  'path ~= "**/Pixels"',
  'path ~= "**/Pixels/*Barrel"',
  'path ~= "**/Pixels/*EndcapN"',
  'path ~= "**/Pixels/*EndcapP"',
  'path ~= "**/ShortStrips"',
  'path ~= "**/ShortStrips/*Barrel"',
  'path ~= "**/ShortStrips/*EndcapN"',
  'path ~= "**/ShortStrips/*EndcapP"',
  'path ~= "**/LongStrips"',
  'path ~= "**/LongStrips/*Barrel"',
  'path ~= "**/LongStrips/*EndcapN"',
  'path ~= "**/LongStrips/*EndcapP"',
]


# Keep stave nodes and all their leaf descendants.
[[selection_rules]]
keep_if = [
  'path ~= "**/PixelLayer*"',
  'path ~= "**/PixelLayer*/stave*"',
  'path ~= "**/PixelLayer*/stave*/**" && is_leaf',
  'path ~= "**/PixelEndcapN*/disk*"',
  'path ~= "**/PixelEndcapN*/disk*/**" && is_leaf',
  'path ~= "**/PixelEndcapP*/disk*"',
  'path ~= "**/PixelEndcapP*/disk*/**" && is_leaf',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/ShortStripLayer*"',
  'path ~= "**/ShortStripLayer*/stave*"',
  'path ~= "**/ShortStripLayer*/stave*/**" && is_leaf',
  'path ~= "**/ShortStripEndcapN*/disk*"',
  'path ~= "**/ShortStripEndcapN*/disk*/**" && is_leaf',
  'path ~= "**/ShortStripEndcapP*/disk*"',
  'path ~= "**/ShortStripEndcapP*/disk*/**" && is_leaf',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/LongStripLayer*"',
  'path ~= "**/LongStripLayer*/stave*"',
  'path ~= "**/LongStripLayer*/stave*/**" && is_leaf',
  'path ~= "**/LongStripEndcapN*/disk*"',
  'path ~= "**/LongStripEndcapN*/disk*/**" && is_leaf',
  'path ~= "**/LongStripEndcapP*/disk*"',
  'path ~= "**/LongStripEndcapP*/disk*/**" && is_leaf',
]


# ── Rules ────────────────────────────────────────────────────────────────────

# Structural nodes: no geometry.

[[rules]]
match = [
  'path ~= "**/Pixels"',
  'path ~= "**/Pixels/*Barrel"',
  'path ~= "**/PixelLayer*"',
  'path ~= "**/Pixels/*EndcapN"',
  'path ~= "**/Pixels/*EndcapP"',

  'path ~= "**/ShortStrips"',
  'path ~= "**/ShortStrips/*Barrel"',
  'path ~= "**/ShortStripLayer*"',
  'path ~= "**/ShortStrips/*EndcapN"',
  'path ~= "**/ShortStrips/*EndcapP"',

  'path ~= "**/LongStrips"',
  'path ~= "**/LongStrips/*Barrel"',
  'path ~= "**/LongStripLayer*"',
  'path ~= "**/LongStrips/*EndcapN"',
  'path ~= "**/LongStrips/*EndcapP"',
]
[rules.tessellation]
skip_geometry = true

# Barrel/endcap/stave nodes: merge descendants.
[[rules]]
match = [
  'path ~= "**/PixelLayer*/stave*"',
  'path ~= "**/PixelEndcapN*/disk*"',
  'path ~= "**/PixelEndcapP*/disk*"',
  'path ~= "**/ShortStripLayer*/stave*"',
  'path ~= "**/ShortStripEndcapN*/disk*"',
  'path ~= "**/ShortStripEndcapP*/disk*"',
  'path ~= "**/LongStripEndcapN*/disk*"',
  'path ~= "**/LongStripEndcapP*/disk*"',
  'path ~= "**/LongStripLayer*/stave*"',
]

[rules.tessellation]
merge_descendants = true
max_segments_circle = 10
fallback = "fail"

# @TODO: Add SupportCylinder0_0...

[[rules]]
match = [
  'path ~= "**/PixelEndcap*/**/DiskSupport_*"',
  'path ~= "**/*StripEndcap*/**/RingSupport*"',
]
[rules.tessellation]
max_segments_circle = 48
