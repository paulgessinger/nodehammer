# ODD tracker: pixels, short strips, long strips

# ── Selection ────────────────────────────────────────────────────────────────

[[selection_rules]]
keep_if = [
  'path ~= "**/Pixels/*Barrel"',
  'path ~= "**/Pixels/*EndcapN"',
  'path ~= "**/Pixels/*EndcapP"',
  'path ~= "**/ShortStrips/*Barrel"',
  'path ~= "**/ShortStrips/*EndcapN"',
  'path ~= "**/ShortStrips/*EndcapP"',
  'path ~= "**/LongStrips/*Barrel"',
  'path ~= "**/LongStrips/*EndcapN"',
  'path ~= "**/LongStrips/*EndcapP"',
]

# Keep sensor nodes.
# [[selection_rules]]
# keep_if = '''
# tag.sensitive == "true" && any(path ~= "**/Pixels/**", path ~= "**/ShortStrips/**", path ~= "**/LongStrips/**")
# '''

# Keep stave nodes and all their leaf descendants.
[[selection_rules]]
keep_if = 'path ~= "**/LongStripLayer*/stave*"'

[[selection_rules]]
keep_if = 'path ~= "**/LongStripLayer*/stave*/**" && is_leaf'

[[selection_rules]]
keep_if = 'path ~= "**/PixelLayer*/stave*"'

[[selection_rules]]
keep_if = 'path ~= "**/PixelLayer*/stave*/**" && is_leaf'

# ── Rules ────────────────────────────────────────────────────────────────────

# [[rules]]
# match = 'path ~= "**/Pixels/**"'
# material = "pixel"

# [[rules]]
# match = 'path ~= "**/ShortStrips/**"'
# material = "short_strip"

# Fallback for LongStrips nodes not matched by source-material rules.
# [[rules]]
# match = 'path ~= "**/LongStrips/**"'
# material = "support"

# Structural nodes: no geometry.
[[rules]]
match = [
  'path ~= "**/Pixels"',
  'path ~= "**/ShortStrips"',
  'path ~= "**/LongStrips"',
]
[rules.tessellation]
skip_geometry = true

[[rules]]
match = [
  'path ~= "**/Pixels/*Barrel"',
  'path ~= "**/Pixels/*EndcapN"',
  'path ~= "**/Pixels/*EndcapP"',
  'path ~= "**/ShortStrips/*Barrel"',
  'path ~= "**/ShortStrips/*EndcapN"',
  'path ~= "**/ShortStrips/*EndcapP"',
  'path ~= "**/LongStrips/*Barrel"',
  'path ~= "**/LongStrips/*EndcapN"',
  'path ~= "**/LongStrips/*EndcapP"',
]
[rules.tessellation]
skip_geometry = true

# Barrel/endcap/stave nodes: merge descendants.
[[rules]]
match = [
  'path ~= "**/PixelLayer*/stave*"',
  'path ~= "**/LongStripLayer*/stave*"',
]

[rules.tessellation]
merge_descendants = true
max_segments_circle = 10
fallback = "skip"

[rules.extras]
visible = true
opacity = 1.0
