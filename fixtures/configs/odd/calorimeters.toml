# ODD calorimeters: ECal + HCal

# ── Selection ────────────────────────────────────────────────────────────────

[[selection_rules]]
keep_if = [
  'path ~= "**/ECal"',
  'path ~= "**/ECalBarrel"',
  'path ~= "**/ECalEndcap_A"',
  'path ~= "**/ECalEndcap_B"',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/ECalBarrel/stave*"',
  'path ~= "**/ECalEndcap_A/stave*"',
  'path ~= "**/ECalEndcap_B/stave*"',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/ECalBarrel/stave*/**" && is_leaf && material != "Air"',
  'path ~= "**/ECalEndcap_A/stave*/**" && is_leaf && material != "Air"',
  'path ~= "**/ECalEndcap_B/stave*/**" && is_leaf && material != "Air"',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/HCal"',
  'path ~= "**/HCalBarrel"',
  'path ~= "**/HCalEndcap_A"',
  'path ~= "**/HCalEndcap_B"',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/HCalBarrel/stave*"',
  'path ~= "**/HCalEndcap_A/stave*"',
  'path ~= "**/HCalEndcap_B/stave*"',
]

[[selection_rules]]
keep_if = [
  'path ~= "**/HCalBarrel/stave*/**" && is_leaf && material != "Air"',
  'path ~= "**/HCalEndcap_A/stave*/**" && is_leaf && material != "Air"',
  'path ~= "**/HCalEndcap_B/stave*/**" && is_leaf && material != "Air"',
]

# ── Rules ────────────────────────────────────────────────────────────────────

[[rules]]
match = 'any(path ~= "**/ECal", path ~= "**/HCal")'
[rules.tessellation]
skip_geometry = true

[[rules]]
match = 'any(path ~= "**/ECalBarrel", path ~= "**/ECalEndcap_A", path ~= "**/ECalEndcap_B", path ~= "**/HCalBarrel", path ~= "**/HCalEndcap_A", path ~= "**/HCalEndcap_B")'
[rules.tessellation]
skip_geometry = true

[[rules]]
match = [
  'path ~= "**/ECalBarrel/stave*"',
  'path ~= "**/ECalEndcap_A/stave*"',
  'path ~= "**/ECalEndcap_B/stave*"',
  'path ~= "**/HCalBarrel/stave*"',
  'path ~= "**/HCalEndcap_A/stave*"',
  'path ~= "**/HCalEndcap_B/stave*"',
]
[rules.tessellation]
merge_descendants = true
# Band-limit the cycling absorber/scintillator layer colors so the stack
# doesn't alias into moire at distance (viewer material-stack prefilter).
average_material_stack = true
max_segments_circle = 10
fallback = "fail"
