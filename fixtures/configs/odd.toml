# ODD full detector configuration
#
# Includes subsystem fragments for tracker, calorimeters, and muon spectrometer.
# Each fragment defines its own selection rules, material assignments, and
# tessellation settings.
#
# Include order matters: base.toml provides the drop-all rule, then subsystem
# fragments add keep rules and specific settings. Global fallback values live
# in [defaults] so they never override specific rules regardless of ordering.

include = [
  "odd/base.toml",
  "odd/materials.toml",
  "odd/tracker.toml",
  "odd/calorimeters.toml",
  "odd/muon.toml",
]

hoist_orphans = true

[export.gltf]
# unit_scale = 10.0      # phoenix
unit_scale = 0.1       # blender
bake_unit_scale = true
# multi_scene = true # phoenix

[export.obj]
unit_scale = 1.0

# ── Selection ────────────────────────────────────────────────────────────────

[[selection_rules]]
keep_if = [
  'name == "BeamPipe"',
  #'name ~= "Solenoid*"'
]

# ── Rules ────────────────────────────────────────────────────────────────────

# World node: no geometry.
[[rules]]
match = 'path ~= "/world"'
[rules.tessellation]
skip_geometry = true

# Solenoid: needs more phi segments.
[[rules]]
match = 'name ~= "Solenoid*"'
[rules.tessellation]
max_segments_circle = 48

# Enable interior-face removal on every calorimeter stave.
[[rules]]
match = [
  'path ~= "**/ECalBarrel/stave*"',
  'path ~= "**/ECalEndcap_A/stave*"',
  'path ~= "**/ECalEndcap_B/stave*"',
  'path ~= "**/HCalBarrel/stave*"',
  'path ~= "**/HCalEndcap_A/stave*"',
  'path ~= "**/HCalEndcap_B/stave*"',
]
[rules.tessellation]
drop_coincident_faces = true

# Enable interior-face removal on long-strip barrel staves.
[[rules]]
match = 'path ~= "**/LongStripLayer*/stave*"'
[rules.tessellation]
drop_coincident_faces = true


# ── Defaults ────────────────────────────────────────────────────────────────
# Global fallback for tessellation and extras — applies when no rule sets a
# field, so specific rules in subsystem fragments always win.

[defaults.tessellation]
max_segments_circle = 10
fallback = "skip"

[defaults.extras]
visible = true
opacity = 1.0
