# ODD single long-strip barrel stave — merged with per-material primitives.

include = ["odd/base.toml", "odd/materials.toml"]

hoist_orphans = true

[export.gltf]
unit_scale = 0.1
bake_unit_scale = true

# ── Selection ────────────────────────────────────────────────────────────────

[[selection_rules]]
keep_if = 'path ~= "**/LongStripBarrel/LongStripLayer0/stave0"'

[[selection_rules]]
keep_if = 'path ~= "**/LongStripBarrel/LongStripLayer0/stave0/**" && is_leaf'

# ── Rules ────────────────────────────────────────────────────────────────────

[[rules]]
match = 'path ~= "/world"'
[rules.tessellation]
skip_geometry = true

[[rules]]
material = "support"

[[rules]]
match = 'path ~= "**/stave0"'
[rules.tessellation]
merge_descendants = true
max_segments_circle = 48
fallback = "skip"

[rules.extras]
visible = true
opacity = 1.0

[[rules]]
[rules.tessellation]
max_segments_circle = 48
fallback = "skip"
