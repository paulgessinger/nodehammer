# nodehammer config - ODD tracker only
#
# hoist_orphans = true: when an intermediate structural container is dropped,
# its kept children are re-parented to the nearest surviving ancestor (or root)
# with their world transform rebased. This lets us drop large container volumes
# while keeping sensor geometry at the correct world positions.
#
# Hierarchy:
#   /world/OpenDataTracker/Pixels/PixelBarrel/PixelLayer0/stave0/module0/sensor_0
#   /world/OpenDataTracker/ShortStrips/ShortStripBarrel/ShortStripLayer0/...
#   /world/OpenDataTracker/LongStrips/LongStripBarrel/LongStripLayer0/...
#   /world/OpenDataTracker/Pixels/PixelEndcapN/PixelEndcapN0/...
#
# Strategy: keep subdetector and barrel/endcap nodes as structural groups.
# Barrel/endcap nodes merge all descendant sensors into a single mesh.

hoist_orphans = true

[export.gltf]
# unit_scale = 10.0      # phoenix
unit_scale = 0.1       # blender
bake_unit_scale = true
# multi_scene = true # phoenix

[export.obj]
unit_scale = 1.0

[materials.pixel]
base_color = [0.8, 0.1, 0.1, 1.0]
metallic = 0.9
roughness = 0.3

[materials.short_strip]
base_color = [0.1, 0.8, 0.1, 1.0]
metallic = 0.9
roughness = 0.3

[materials.long_strip]
base_color = [0.1, 0.1, 0.8, 1.0]
metallic = 0.9
roughness = 0.3

[materials.ecal]
base_color = [0.9, 0.7, 0.1, 1.0]
metallic = 0.2
roughness = 0.6

[materials.hcal]
base_color = [0.2, 0.7, 0.7, 1.0]
metallic = 0.2
roughness = 0.6

[materials.muon]
base_color = [0.7, 0.4, 0.9, 1.0]
metallic = 0.3
roughness = 0.5

[materials.support]
base_color = [0.5, 0.5, 0.5, 1.0]
metallic = 0.0
roughness = 0.7

# ── Selection ────────────────────────────────────────────────────────────────

# Drop everything by default.
[[selection_rules]]
drop_if = 'name ~= "*"'

# Keep subdetector nodes as top-level structural groups.
# [[selection_rules]]
# keep_if = 'any(path ~= "**/Pixels", path ~= "**/ShortStrips", path ~= "**/LongStrips")'
# keep_if = 'any(path ~= "**/Pixels")'

# Keep barrel/endcap nodes as structural groups.
[[selection_rules]]
keep_if = '''
any(
  name == "BeamPipe",
  path ~= "**/Pixels/*Barrel",
  path ~= "**/Pixels/*EndcapN",
  path ~= "**/Pixels/*EndcapP",
  path ~= "**/ShortStrips/*Barrel",
  path ~= "**/ShortStrips/*EndcapN",
  path ~= "**/ShortStrips/*EndcapP",
  path ~= "**/LongStrips/*Barrel",
  path ~= "**/LongStrips/*EndcapN",
  path ~= "**/LongStrips/*EndcapP",
  path ~= "**/ECalBarrel",
  path ~= "**/ECalEndcap_A",
  path ~= "**/ECalEndcap_B",
  path ~= "**/HCalBarrel",
  path ~= "**/HCalEndcap_A",
  path ~= "**/HCalEndcap_B",
  path ~= "**/MuonSpectrometerBarrel",
  path ~= "**/MuonSpectrometerBarrel/chamber*",
  path ~= "**/MuonSpectrometerEndCapN",
  path ~= "**/MuonSpectrometerEndCapN/*/chamber*",
  path ~= "**/MuonSpectrometerEndCapP",
  path ~= "**/MuonSpectrometerEndCapP/*/chamber*",
)
'''

# Keep sensor nodes (sensitive + tracker subdetectors).
[[selection_rules]]
keep_if = '''
tag.sensitive == "true" && any(path ~= "**/Pixels/**", path ~= "**/ShortStrips/**", path ~= "**/LongStrips/**")
'''

# ── Rules ────────────────────────────────────────────────────────────────────

# Material assignment per subdetector.
[[rules]]
scope = "**/Pixels/**"
material = "pixel"

[[rules]]
scope = "**/ShortStrips/**"
material = "short_strip"

[[rules]]
scope = "**/LongStrips/**"
material = "long_strip"

[[rules]]
scope = "**/ECal/**"
material = "ecal"

[[rules]]
scope = "**/HCal/**"
material = "hcal"

[[rules]]
scope = "**/MuonSpectrometer*/**"
material = "muon"

# Fallback material.
[[rules]]
material = "support"

# World and subdetector nodes: structural only, no geometry.
[[rules]]
scope = [
  "/world",
  "**/Pixels",
  "**/ShortStrips",
  "**/LongStrips",
  "**/MuonSpectrometerBarrel",
  "**/MuonSpectrometerEndCapN",
  "**/MuonSpectrometerEndCapP",
  # "**/ECalBarrel",
  # "**/ECalBarrel/stave*",
  # "**/ECalBarrel/stave*/layer*",
]
[rules.tessellation]
skip_geometry = true

# Barrel/endcap nodes: merge all descendant sensor meshes into one.
[[rules]]
# This needs to be limited to pixel/long/short strips only.
scope = [
  "**/Pixels/*Barrel",
  "**/Pixels/*EndcapN",
  "**/Pixels/*EndcapP",
  "**/ShortStrips/*Barrel",
  "**/ShortStrips/*EndcapN",
  "**/ShortStrips/*EndcapP",
  "**/LongStrips/*Barrel",
  "**/LongStrips/*EndcapN",
  "**/LongStrips/*EndcapP",
]
[rules.tessellation]
merge_children = true
max_segments_circle = 48
fallback = "skip"
[rules.extras]
visible = true
opacity = 1.0

# [[rules]]
# scope = "**/MuonSpectrometerBarrel/chamber*/tube*"
# [rules.tessellation]
# max_segments_circle = 5
# fallback = "skip"

# Fallback tessellation.
[[rules]]
[rules.tessellation]
max_segments_circle = 48
fallback = "skip"
[rules.extras]
visible = true
opacity = 1.0
