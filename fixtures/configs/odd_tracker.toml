# nodehammer config - ODD tracker only
#
# hoist_orphans = true: when an intermediate structural container is dropped,
# its kept children are re-parented to the nearest surviving ancestor (or root)
# with their world transform rebased. This lets us drop large container volumes
# while keeping sensor geometry at the correct world positions.

hoist_orphans = true

[materials.silicon]
base_color = [0.2, 0.6, 0.9, 1.0]
metallic = 0.1
roughness = 0.4

[materials.support]
base_color = [0.5, 0.5, 0.5, 1.0]
metallic = 0.0
roughness = 0.7

# Keep only sensor nodes (sensitive=true) in the pixel subdetectors.
# The tree is: world → OpenDataTracker → Pixels → {PixelBarrel, PixelEndcapN, PixelEndcapP} → modules → sensors
# hoist_orphans re-parents the kept sensors to world with world-space transforms.

[[selection_rules]]
[selection_rules.drop_if]
type = "name_glob"
pattern = "*"

# Keep nodes that are both sensitive AND belong to a pixel sub-detector.
[[selection_rules]]
[selection_rules.keep_if]
type = "and"
operands = [
  { type = "tag", key = "sensitive", value = "true" },
  { type = "or", operands = [
    { type = "path_glob", pattern = "**/Pixels/**" },
    { type = "path_glob", pattern = "**/ShortStrips/**" },
    { type = "path_glob", pattern = "**/LongStrips/**" },
  ] },
  # {type = "or", operands = [
  #   {type = "tag", key = "subdetector", value = "PixelBarrel"},
  #   {type = "tag", key = "subdetector", value = "PixelEndcapN"},
  #   {type = "tag", key = "subdetector", value = "PixelEndcapP"},
  # ]},
]

# Material rules

[[material_rules]]
material = "silicon"
[material_rules.match]
type = "tag"
key = "sensitive"
value = "true"

[[material_rules]]
material = "support"

# Tessellation

[[tessellation_rules]]
scope = "/world"
skip_geometry = true

[[tessellation_rules]]
max_segments_circle = 48
fallback = "skip"
