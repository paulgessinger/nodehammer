name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prek
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  build:
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            kind: native
            artifact-name: nodehammer-linux-x86_64
            # Links the whole static library into a probe shared module, so a
            # non-PIC object fails the build instead of surfacing later at the
            # first real .so link (shared library / Python extension). One job
            # is enough: x86_64 ELF is where the relocation check bites, and the
            # probe is skipped on Mach-O, Windows and wasm anyway.
            cmake-extra: -DNODEHAMMER_PIC_CHECK=ON
            # Compile the nanobind extension and run its pytest suite, which
            # ctest picks up as one more test. Without this the bindings are
            # built nowhere in CI and a change to the public API could break them
            # while every check stayed green -- the same blind spot ROOT/DD4hep
            # had. On the three legs that wheels target; Windows is excluded
            # deliberately (no wheels are planned for it, and the bindings have
            # never been compiled against a dllimport build) rather than
            # silently, and LCG buys nothing the native legs do not already give.
            python-tests: true
          - os: ubuntu-24.04-arm
            kind: native
            artifact-name: nodehammer-linux-aarch64
            python-tests: true
          - os: macos-26
            kind: native
            artifact-name: nodehammer-macos-aarch64
            python-tests: true
          - os: windows-2025
            kind: native
            artifact-name: nodehammer-windows-x86_64
          - os: ubuntu-24.04
            kind: wasm
            artifact-name: nodehammer-wasm32

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cmake/Version.cmake derives the version from `git describe`, and the
          # default shallow clone carries no tags -- so every artifact this job
          # has ever produced reports 0.0.0. That was invisible until the wheels
          # started reporting the truth: without this, a single tagged release
          # would ship a tarball claiming 0.0.0 next to a wheel claiming 0.1.4.
          fetch-depth: 0

      - name: Remove untrusted aws/tap (macOS)
        if: runner.os == 'macOS'
        run: brew untap aws/tap || true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Install GCC 14 and viewer deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 g++-14 \
            libgtk-3-dev \
            libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # ilammy/msvc-dev-cmd is unmaintained and still targets Node.js 20, which
      # the runners now warn about. setup-msvc-dev is an actively maintained
      # equivalent on Node.js 24; unlike msvc-dev-cmd it has no default arch.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Install emsdk
        if: matrix.kind == 'wasm'
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 5.0.6
          actions-cache-folder: emsdk-cache

      - name: Stabilize emsdk path
        if: matrix.kind == 'wasm'
        shell: bash
        run: |
          # setup-emsdk extracts to /home/runner/work/_temp/<random-uuid>/emsdk-main.
          # The UUID changes every run, so it appears in -I args, in the conan
          # toolchain preset (baked at conan-install time), and in #line markers
          # of preprocessed output -> 0% ccache hits. Symlink to a stable path
          # and rewrite EMSDK/PATH for downstream steps.
          stable="$HOME/emsdk-stable"
          ln -sfn "$EMSDK" "$stable"
          echo "EMSDK=$stable" >> "$GITHUB_ENV"
          {
            echo "$stable"
            echo "$stable/upstream/emscripten"
          } >> "$GITHUB_PATH"

      - name: Restore Emscripten cache
        if: matrix.kind == 'wasm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk-stable/upstream/emscripten/cache
          key: emscripten-cache-5.0.6-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'profiles/emscripten', 'conanfile.py') }}-${{ github.run_id }}
          restore-keys: |
            emscripten-cache-5.0.6-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'profiles/emscripten', 'conanfile.py') }}-
            emscripten-cache-5.0.6-

      # WGSL shader validation (see cmake/Sokol.cmake). naga-cli has no prebuilt
      # binary, so cargo-install it; cache the resulting binary keyed on the
      # pinned version so only the first run pays the build cost. Saving is
      # restricted to main: the key only ever changes when the pinned version
      # bumps, so PR branches just restore main's entry via the same key
      # instead of each writing their own redundant copy.
      - name: Restore naga-cli cache (WGSL validator)
        if: matrix.kind == 'wasm'
        id: cache-naga
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install naga-cli (WGSL validator)
        if: matrix.kind == 'wasm' && steps.cache-naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.0 --locked

      - name: Save naga-cli cache (WGSL validator)
        if: matrix.kind == 'wasm' && steps.cache-naga.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.0-${{ runner.os }}-${{ runner.arch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install Conan
        run: uv tool install conan

      # One interpreter for both halves: CMake builds the extension against it
      # and ctest runs pytest with it, so there is no way for the module to be
      # compiled for one Python and imported by another. 3.12 is the abi3 floor.
      - name: Set up Python for the bindings
        if: matrix.python-tests
        shell: bash
        run: |
          uv venv --python 3.12 .venv-ci
          uv pip install --python .venv-ci --group dev
          echo "NH_PYTHON=$PWD/.venv-ci/bin/python" >> "$GITHUB_ENV"

      - name: Detect Conan profile
        shell: bash
        run: |
          conan profile detect --force
          cp ~/.conan2/profiles/default ./.conan-profile-snapshot

      - name: Restore Conan cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.artifact-name }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot', 'profiles/emscripten') }}-${{ github.run_id }}
          restore-keys: |
            conan-${{ matrix.artifact-name }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot', 'profiles/emscripten') }}-
            conan-${{ matrix.artifact-name }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ccache-${{ matrix.artifact-name }}
          # The action appends a per-run timestamp to the key, so every save is a
          # new entry rather than a replacement. Publishing from every branch put
          # five of those into the quota on every push, and a cache written on a
          # pull-request ref is scoped to that pull request, so none of them were
          # reachable from anywhere else. Only main writes; everything else
          # restores from it by key prefix, which the timestamped keys are shaped
          # for. Same posture as the Conan and Emscripten caches around it.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Conan install
        shell: bash
        run: ci/build.sh conan-install ${{ matrix.kind }} -o viewer=True

      - name: Save Conan cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.artifact-name }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot', 'profiles/emscripten') }}-${{ github.run_id }}

      - name: Configure
        shell: bash
        run: ci/build.sh configure ${{ matrix.kind }} -DNODEHAMMER_WITH_VIEWER=ON ${{ matrix.cmake-extra }} ${{ matrix.python-tests && format('-DNODEHAMMER_BUILD_PYTHON=ON -DPython_EXECUTABLE={0}', env.NH_PYTHON) || '' }}

      - name: Build
        shell: bash
        env:
          # emcc is freshly extracted each run -> mtimes differ, so hash by
          # content. BASEDIR + NOHASHDIR strip the workspace prefix from cwd
          # and from absolute include paths in compile args / #line markers.
          # SLOPPINESS lets us cache TUs that touch __DATE__/__TIME__ and
          # absorbs include-mtime jitter from re-extracted toolchains/deps.
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,clang_index_store
        run: ci/build.sh build ${{ matrix.kind }}

      - name: ccache post-build stats
        if: always()
        shell: bash
        run: ccache -sv

      - name: Save Emscripten cache
        if: always() && matrix.kind == 'wasm' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk-stable/upstream/emscripten/cache
          key: emscripten-cache-5.0.6-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'profiles/emscripten', 'conanfile.py') }}-${{ github.run_id }}

      # Closure runs only in this configuration, so this is the only place a
      # renamed-away or never-exported `Module['x']` can be seen. The failure it
      # guards against is silent: the property is simply undefined, and the page
      # dies at the moment that handler first runs, in the browser, in
      # production. Text-only -- no browser, no node.
      - name: Check wasm Module linkage
        if: matrix.kind == 'wasm'
        shell: bash
        run: |
          scripts/check_wasm_module_linkage.py \
            build/emscripten/Release/nodehammer-wgpu.js \
            build/emscripten/Release/nodehammer-gles3.js

      # The other half of the boundary: drives nh_compute_build in node against
      # the closure'd compute module, i.e. the heap staging, ccall marshalling
      # and progress postMessage protocol the browser worker uses, without a
      # browser. `just wasm-compute-smoke` runs the same script locally but
      # defaults to RelWithDebInfo, where Closure never runs -- only this pass
      # can see a minification break in the worker protocol.
      #
      # ODD rather than a synthetic scene: it is already the CI fixture (see
      # ci/bench.sh), it needs no native build to mint, and at 325k render nodes
      # it actually produces progress messages, which a trivial scene does not.
      - name: Compute module smoke (Release)
        if: matrix.kind == 'wasm'
        shell: bash
        run: |
          zstd -dc odd.nhb.zst > smoke.nhb
          node scripts/wasm_compute_smoke.js \
            build/emscripten/Release/nodehammer-compute.js smoke.nhb

      - name: Test
        shell: bash
        run: ci/build.sh test ${{ matrix.kind }}

      - name: Install hyperfine
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: hyperfine

      - name: Benchmark
        shell: bash
        run: ci/bench.sh ${{ matrix.kind }} ${{ matrix.artifact-name }}

      - name: Upload bench
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.artifact-name }}
          path: bench.json
          if-no-files-found: error
          retention-days: 7

      - name: Stage install tree
        shell: bash
        run: ci/build.sh install ${{ matrix.kind }} stage

      # #41 step 5's verification, against the tree this job just staged.
      # Native only: NODEHAMMER_BUILD_SHARED is a hard CMake error under
      # Emscripten, which is why the option lives in ci/build.sh's `native` case
      # rather than as a matrix field.
      - name: Verify shared install
        if: matrix.kind == 'native'
        shell: bash
        run: ci/verify-shared-install.sh stage

      - name: Package archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd stage && 7z a "../${{ matrix.artifact-name }}.zip" .)
          else
            tar czf "${{ matrix.artifact-name }}.tar.gz" -C stage .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
  wheels:
    name: wheel ${{ matrix.identifier }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            identifier: cp312-manylinux_x86_64
          - os: ubuntu-24.04-arm
            identifier: cp312-manylinux_aarch64
          - os: macos-26
            identifier: cp312-macosx_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm reads tags. The default shallow, tagless clone is why
          # every other job in this workflow builds a library reporting 0.0.0;
          # a wheel must not inherit that.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Derive the version outside the container
        id: version
        shell: bash
        # cibuildwheel copies the project into the container without .git, so
        # setuptools_scm cannot work it out in there. The local scheme is dropped
        # because PyPI rejects local version identifiers on upload, and a wheel
        # that cannot be uploaded is not worth building here.
        run: |
          v=$(SETUPTOOLS_SCM_OVERRIDES_FOR_NODEHAMMER='{local_scheme = "no-local-version"}' \
              uv run --no-project --with setuptools-scm python -m setuptools_scm | tail -1)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

      - name: Point Conan and ccache at cacheable directories
        if: runner.os == 'Linux'
        shell: bash
        # On Linux the dependencies (and now the compile itself) happen *inside*
        # the container, so each cache has to live on the other side of the
        # /host mount cibuildwheel provides or it dies with the container. macOS
        # needs nothing here: before-all and the build both run on the host, so
        # Conan and ccache already write to the home directory cached below.
        run: |
          echo "CONAN_HOME=/host${HOME}/.conan2" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=/host${HOME}/.cache/ccache" >> "$GITHUB_ENV"

      # Keyed on conanfile.py alone, with no run id — unlike the caches in the
      # build job. Those grow run to run and want a fresh entry each time; this
      # one is a fixed dependency set that only changes when the recipe does, so
      # a content key writes once and is reused until the recipe moves. That also
      # keeps three more ~250 MB blobs from churning against the repository's
      # cache quota, which one open PR has exhausted before (#51).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-wheel-${{ matrix.identifier }}-${{ hashFiles('conanfile.py') }}

      # ccache itself, unlike the Conan cache above, grows run to run the same
      # way the build job's does -- a run-id key plus prefix restore-keys, only
      # saved from main, same reasoning as ci.yml's other evolving caches.
      - name: Restore ccache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-wheel-${{ matrix.identifier }}-${{ github.run_id }}
          restore-keys: |
            ccache-wheel-${{ matrix.identifier }}-

      # macOS builds on the host, so this is the same ccache-action the build
      # job uses -- it installs ccache and handles the GitHub Actions cache
      # restore/save itself. Linux instead installs ccache inside the container
      # (pyproject.toml before-all) and manages the cache manually above/below,
      # since the container is where the compiling happens.
      - name: Set up ccache
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ccache-wheel-${{ matrix.identifier }}
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ONLY: ${{ matrix.identifier }}
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.value }}

      # The container builds as root, so everything it wrote through the /host
      # mount is owned by root on the runner and actions/cache cannot read it to
      # save. Same workaround the LCG job already carries for the same reason.
      - name: Fix cache ownership
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$USER" "$HOME/.conan2" "$HOME/.cache/ccache" || true

      - name: Save ccache
        if: always() && runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-wheel-${{ matrix.identifier }}-${{ github.run_id }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.identifier }}
          path: wheelhouse/*.whl
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  # The wheels are cp312-abi3 on three platforms; Windows, ppc64le and anything
  # else get nothing to install and no source to fall back to.
  # [tool.scikit-build.sdist] has been shaped for one since the wheels landed --
  # this builds it. Still needs Conan for CMAKE_TOOLCHAIN_FILE, so installing
  # from it fails with a CMake error; that beats no sdist existing at all.
  sdist:
    name: sdist
    runs-on: ubuntu-slim
    # Output goes to a public index, so: minimum token, no credentials left in
    # the checkout. The jobs around it predate this.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm reads tags, as in the wheels job.
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      # Cheapest job on the tag path, so the tag is checked here against the
      # version the artifacts will claim: a mismatch fails in a minute rather
      # than after the wheel matrix -- or on PyPI, after the number is spent.
      - name: Check the tag matches the derived version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          derived=$(SETUPTOOLS_SCM_OVERRIDES_FOR_NODEHAMMER='{local_scheme = "no-local-version"}' \
              uv run --no-project --with setuptools-scm python -m setuptools_scm | tail -1)
          if [ "$tag" != "$derived" ]; then
            echo "::error::tag $GITHUB_REF_NAME would be published as $derived"
            echo "Tags must carry the PEP 440 *normalized* version after the v:" >&2
            echo "  v0.2.0, v0.2.0rc1, v0.2.0b1  -- not v0.2.0-rc1 or v0.2.0.RC1." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME publishes as $derived"

      - name: Build sdist
        shell: bash
        # no-local-version as in the wheels: PyPI rejects local identifiers, so
        # a dev sdist carrying +g<sha> could not be uploaded with them.
        run: |
          SETUPTOOLS_SCM_OVERRIDES_FOR_NODEHAMMER='{local_scheme = "no-local-version"}' \
            uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [wheels, sdist]
    # Main only. Every commit gets a distinct dev version from the commit count,
    # so uploads do not collide, and skip-existing covers a re-run of the same
    # commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Not ubuntu-slim, like the other coordinating jobs: the publish action is a
    # Docker container action, and the slim image carries no Docker daemon, so it
    # fails on `docker run` before it ever reaches TestPyPI.
    runs-on: ubuntu-24.04
    # The environment is not decoration: TestPyPI's trusted publisher records it
    # and rejects an OIDC token whose `environment` claim does not match, so it is
    # what narrows "anything in this repo running ci.yml" down to "this job". The
    # matching deployment-branch rule on the GitHub side (main only) is what stops
    # a branch from entering the environment in the first place, which is why the
    # `if:` above is defence in depth rather than the only guard.
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nodehammer
    permissions:
      # Trusted publishing: the job proves its identity to TestPyPI with a
      # short-lived OIDC token, so there is no API token in the repository to
      # leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    # Any v* tag, pre-releases included: v0.2.0rc1 uploads as a PEP 440
    # pre-release, which only `--pre` or an exact pin resolves. Dev builds stay
    # on TestPyPI -- a PyPI version number can be yanked but never reused.
    if: startsWith(github.ref, 'refs/tags/')
    # The whole matrix, not just the jobs it uploads. `wheels` keeps no `needs:`
    # so PRs get wheel feedback in parallel; the gate belongs here, where the
    # upload is irreversible.
    needs: [build, wheels, sdist]
    # Not ubuntu-slim: Docker container action, no daemon there. As above.
    runs-on: ubuntu-24.04
    # Needs a `pypi` environment whose deployment rule is *protected tags* (v*),
    # not a branch, matching the trusted publisher registered on PyPI. That pair
    # is what stops anything else in the repo minting this token.
    environment:
      name: pypi
      url: https://pypi.org/p/nodehammer
    permissions:
      # Trusted publishing: no long-lived token in the repo, and PEP 740
      # attestations come along by default.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      # No skip-existing, unlike TestPyPI: there it absorbs a re-run of the same
      # commit, here a collision means the tag is wrong and should fail loudly.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  bench-summary:
    name: Benchmark summary
    needs: build
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bench artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bench-results
          pattern: bench-*

      - name: Render summary
        run: python3 ci/bench-summary.py bench-results >> "$GITHUB_STEP_SUMMARY"

  web-runtime-merge:
    name: web runtime into ${{ matrix.artifact }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - nodehammer-linux-x86_64
          - nodehammer-linux-aarch64
          - nodehammer-macos-aarch64
          - nodehammer-windows-x86_64
    steps:
      # A native build cannot produce the web runtime: the bundles are
      # Emscripten output, so no native `cmake --install` has anything to copy.
      # A platform archive that carries one therefore has to be assembled, and
      # this is the only place that can do it. The wasm tree is
      # platform-independent, so one build overlays onto all four.
      #
      # Without this, `nodehammer viewer --web` from a downloaded release finds
      # nothing at share/nodehammer/web and can only tell the user to go get a
      # runtime -- the same friction the Python side rejected when it made
      # nodehammer-web a default dependency rather than an extra.
      - name: Download the platform archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: platform

      - name: Download the web runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodehammer-wasm32
          path: wasm-artifact

      - name: Overlay the runtime
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wasm stage
          tar xzf wasm-artifact/nodehammer-wasm32.tar.gz -C wasm
          runtime=wasm/share/nodehammer/web
          test -f "$runtime/nh_runtime.json" || {
              echo "::error::the wasm artifact carries no web runtime at share/nodehammer/web"
              exit 1
          }

          name='${{ matrix.artifact }}'
          if [ -f "platform/$name.zip" ]; then
              unzip -q "platform/$name.zip" -d stage
              archive="$name.zip"
          else
              tar xzf "platform/$name.tar.gz" -C stage
              archive="$name.tar.gz"
          fi

          mkdir -p stage/share/nodehammer
          cp -R "$runtime" stage/share/nodehammer/web

          # The layout the ladder's third rung resolves: <exe>/../share/nodehammer/web.
          test -x stage/bin/nodehammer || test -f stage/bin/nodehammer.exe
          test -f stage/share/nodehammer/web/index.html

          rm -f "$archive"
          if [ "${archive##*.}" = "zip" ]; then
              (cd stage && zip -qr "../$archive" .)
          else
              tar czf "$archive" -C stage .
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # The two halves were built by different jobs from different toolchains,
      # and nothing else compares them. `download-artifact` is scoped to this
      # run, so they cannot come from different commits -- what this catches is
      # two legs that derived their versions differently, which is exactly what
      # a pre-release tag did to cmake/Version.cmake once already. Only on the
      # leg whose binary this runner can execute; one check is enough, since
      # both inputs are shared by all four.
      - name: The two halves agree on the version
        if: matrix.artifact == 'nodehammer-linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          native=$(stage/bin/nodehammer --version | awk '{print $NF}')
          stamped=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' \
                    stage/share/nodehammer/web/nh_runtime.json)
          echo "native=$native  runtime=$stamped"
          if [ "$native" != "$stamped" ]; then
              echo "::error::the native build says $native, the web runtime says $stamped"
              exit 1
          fi

      # Same name, overwriting what `build` uploaded: the merged archive *is*
      # the release artifact, and leaving both variants around would only invite
      # publishing the one without a runtime. The wasm artifact is untouched, so
      # the Pages job (which stages from it) is unaffected.
      - name: Replace the platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.overlay.outputs.archive }}
          overwrite: true
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  pages:
    name: Build Pages site
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download wasm build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodehammer-wasm32
          path: wasm-artifact

      - name: Unpack wasm runtime
        shell: bash
        run: |
          mkdir -p wasm-runtime
          tar xzf wasm-artifact/nodehammer-wasm32.tar.gz -C wasm-runtime
          ls -la wasm-runtime/share/nodehammer/web

      # The native build is only here to mint the .nhb fixture for the smoke
      # below; this job otherwise deals purely in the wasm artifact.
      # Landing page + one self-contained directory per web posture:
      # app/ (no sidecar -> application mode) and odd/ + odd-simple/
      # (sidecar -> locked .nhproj publications).
      # share/nodehammer/web, not bin/: the artifact's servable payload is a
      # directory holding the shell and the worker script alongside the
      # bundles, and staging from it is what proves those install rules exist
      # -- reading the shell out of this job's checkout would hide a payload
      # that no machine without a checkout could serve.
      - name: Assemble site
        shell: bash
        run: scripts/build_pages_site.sh wasm-runtime/share/nodehammer/web _site

      # Keeps the assembly honest on pull requests, which never deploy: the
      # artifact stays browsable and the job fails here if a posture is
      # malformed (missing runtime, dangling sidecar, non-self-describing
      # archive).
      - name: Check site layout
        shell: bash
        run: scripts/check_pages_site.py _site

      # On main the deployed site is the browsable output; elsewhere (PRs, tags)
      # this artifact is the only way to look at what would be published.
      - name: Upload site artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site
          path: _site
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy-pages:
    name: Deploy Pages site
    needs: pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time, and a half-finished one should not
    # be cancelled by the next push — hence a group of its own.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      # `enablement: true` turns Pages on (source: GitHub Actions) the first
      # time this runs, so the deployment needs no click in repo settings.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  release:
    name: Create Release
    # web-runtime-merge, not just build: it replaces the four platform
    # archives in place, and without waiting for it this job races the
    # overwrite and can publish the archive that carries no web runtime.
    needs: [build, web-runtime-merge, wheels, sdist]
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # v3.0.2 infers nothing from the tag: `prerelease` is exactly what we
      # pass here, and unset means "full release". Our tags are PEP 440 like
      # the PyPI versions (v1.2.0, v1.2.0rc1), so a final release is exactly
      # three dot-separated numbers -- anything trailing (rc/a/b/dev/post) is a
      # pre-release.
      - name: Classify tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # Explicit globs, not `artifacts/**/*`: `download-artifact` with no
      # pattern pulls *every* artifact of the run, and the five `bench-*` ones
      # each hold a file named `bench.json`. Uploaded concurrently under one
      # asset name they race on the overwrite path -- one deletes the asset
      # another is updating, which 404s and fails the job (and leaves no
      # bench.json attached at all). Anything not listed here stays out.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/nodehammer-*/*
            artifacts/wheel-*/*
            artifacts/sdist/*
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          # Publish, never leave a draft behind. The action stages a full
          # release as a draft and flips it live only after every asset is up,
          # so a failed upload leaves nothing half-visible -- but it also means
          # a *failed* job leaves the draft sitting there, which is what
          # v1.2.0rc1 did until it was published by hand.
          draft: false

  lcg:
    name: LCG 109 (el9-gcc15-opt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@10197e000cc0add8e54ac4fb73d3ed44e2de72b4 # v5.5

      - name: Restore Conan cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.conan2/p
          key: conan-lcg109-${{ hashFiles('conanfile.py') }}-${{ github.run_id }}
          restore-keys: |
            conan-lcg109-${{ hashFiles('conanfile.py') }}-
            conan-lcg109-

      - name: Build and test in LCG view
        uses: aidasoft/run-lcg-view@b4da52e1c5ccb70a60ad4e7216de0a90664d5849 # v6.0.2
        with:
          release-platform: "LCG_109/x86_64-el9-gcc15-opt"
          ccache-key: ccache-lcg109
          run: |
            export CONAN_HOME=$(pwd)/.conan2
            curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
            source "$HOME/.local/bin/env"
            uv tool install conan
            conan profile detect --force
            ci/build.sh conan-install native
            ci/build.sh configure native -DNODEHAMMER_WITH_TGEO=ON -DNODEHAMMER_WITH_DD4HEP=ON
            ci/build.sh build native
            ci/build.sh test native -j4
            # The only environment where the backends are *shared* libraries
            # rather than absorbable static archives, so the only real test of
            # cmake/nodehammer-config.cmake.in's "no find_dependency() needed".
            ci/build.sh install native stage
            ci/verify-shared-install.sh stage

      # blubb

      - name: Fix Conan cache ownership
        if: always()
        run: sudo chown -R "$USER" "${{ github.workspace }}/.conan2" || true

      - name: Save Conan cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.conan2/p
          key: conan-lcg109-${{ hashFiles('conanfile.py') }}-${{ github.run_id }}
