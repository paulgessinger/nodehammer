name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prek
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: j178/prek-action@cbc2f23eb5539cf20d82d1aabd0d0ecbcc56f4e3 # v2.0.2

  build:
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: nodehammer-linux-x86_64
            binary: build/Release/nodehammer
          - os: ubuntu-24.04-arm
            artifact-name: nodehammer-linux-aarch64
            binary: build/Release/nodehammer
          - os: macos-15
            artifact-name: nodehammer-macos-aarch64
            binary: build/Release/nodehammer
          - os: windows-2025
            artifact-name: nodehammer-windows-x86_64.exe
            binary: build/Release/nodehammer.exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@ea83089aa35e08e459464341fe24ad024ee2466f # v4.3.1

      - name: Install GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Conan
        run: uv tool install conan

      - name: Detect Conan profile
        shell: bash
        run: |
          conan profile detect --force
          cp ~/.conan2/profiles/default ./.conan-profile-snapshot

      - name: Restore Conan cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot') }}-${{ github.run_id }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot') }}-
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce # v1.2.22
        with:
          key: ccache-${{ runner.os }}-${{ runner.arch }}

      - name: Conan install
        run: >
          conan install . --build=missing
          -s:a compiler.cppstd=23
          -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot') }}-${{ github.run_id }}

      - name: Configure
        run: >
          cmake --preset conan-release
          -GNinja
          -DNODEHAMMER_WERROR=ON
          -DNODEHAMMER_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset conan-release

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

      - name: Stage binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p stage
          cp "${{ matrix.binary }}" "stage/${{ matrix.artifact-name }}"

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: stage/${{ matrix.artifact-name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  lcg:
    name: LCG 109 (el9-gcc15-opt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@10197e000cc0add8e54ac4fb73d3ed44e2de72b4 # v5.5

      - name: Restore Conan cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.conan2/p
          key: conan-lcg109-${{ hashFiles('conanfile.py') }}-${{ github.run_id }}
          restore-keys: |
            conan-lcg109-${{ hashFiles('conanfile.py') }}-
            conan-lcg109-

      - name: Build and test in LCG view
        uses: aidasoft/run-lcg-view@d8db17c61216548c9192889942d46ff2d7c3a3b6 # v6
        with:
          release-platform: "LCG_109/x86_64-el9-gcc15-opt"
          ccache-key: ccache-lcg109
          run: |
            export CONAN_HOME=$(pwd)/.conan2
            curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
            source "$HOME/.local/bin/env"
            uv tool install conan
            conan profile detect --force
            conan install . --build=missing \
              -s:a compiler.cppstd=23 \
              -c tools.cmake.cmaketoolchain:generator=Ninja
            cmake --preset conan-release \
              -GNinja \
              -DNODEHAMMER_WERROR=ON \
              -DNODEHAMMER_BUILD_TESTS=ON \
              -DNODEHAMMER_WITH_TGEO=ON \
              -DNODEHAMMER_WITH_DD4HEP=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build --preset conan-release
            ctest --test-dir build/Release --output-on-failure -j4

      # blubb

      - name: Fix Conan cache ownership
        if: always()
        run: sudo chown -R "$USER" "${{ github.workspace }}/.conan2" || true

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.conan2/p
          key: conan-lcg109-${{ hashFiles('conanfile.py') }}-${{ github.run_id }}
