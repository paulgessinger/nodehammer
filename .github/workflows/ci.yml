name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prek
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: j178/prek-action@cbc2f23eb5539cf20d82d1aabd0d0ecbcc56f4e3 # v2.0.2

  build:
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            kind: native
            artifact-name: nodehammer-linux-x86_64
          - os: ubuntu-24.04-arm
            kind: native
            artifact-name: nodehammer-linux-aarch64
          - os: macos-15
            kind: native
            artifact-name: nodehammer-macos-aarch64
          - os: windows-2025
            kind: native
            artifact-name: nodehammer-windows-x86_64
          - os: ubuntu-24.04
            kind: wasm
            artifact-name: nodehammer-wasm32

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@ea83089aa35e08e459464341fe24ad024ee2466f # v4.3.1

      - name: Install GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install emsdk
        if: matrix.kind == 'wasm'
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Stabilize emsdk path
        if: matrix.kind == 'wasm'
        shell: bash
        run: |
          # setup-emsdk extracts to /home/runner/work/_temp/<random-uuid>/emsdk-main.
          # The UUID changes every run, so it appears in -I args, in the conan
          # toolchain preset (baked at conan-install time), and in #line markers
          # of preprocessed output -> 0% ccache hits. Symlink to a stable path
          # and rewrite EMSDK/PATH for downstream steps.
          stable="$HOME/emsdk-stable"
          ln -sfn "$EMSDK" "$stable"
          echo "EMSDK=$stable" >> "$GITHUB_ENV"
          {
            echo "$stable"
            echo "$stable/upstream/emscripten"
          } >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Conan
        run: uv tool install conan

      - name: Detect Conan profile
        shell: bash
        run: |
          conan profile detect --force
          cp ~/.conan2/profiles/default ./.conan-profile-snapshot

      - name: Restore Conan cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.artifact-name }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot', 'profiles/emscripten') }}-${{ github.run_id }}
          restore-keys: |
            conan-${{ matrix.artifact-name }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot', 'profiles/emscripten') }}-
            conan-${{ matrix.artifact-name }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce # v1.2.22
        with:
          key: ccache-${{ matrix.artifact-name }}

      - name: ccache pre-build stats
        shell: bash
        run: |
          ccache --version
          ccache -p | grep -E '(compiler_check|sloppiness|base_dir|hash_dir|cache_dir|max_size)' || true
          ccache -sv

      - name: Conan install
        shell: bash
        run: ci/build.sh conan-install ${{ matrix.kind }}

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.artifact-name }}-${{ hashFiles('conanfile.py', '.conan-profile-snapshot', 'profiles/emscripten') }}-${{ github.run_id }}

      - name: Configure
        shell: bash
        run: ci/build.sh configure ${{ matrix.kind }}

      - name: Build
        shell: bash
        env:
          CCACHE_DEBUG: "1"
          CCACHE_DEBUGDIR: ${{ github.workspace }}/ccache-debug
          # emcc is freshly extracted each run -> mtimes differ, so hash by
          # content. BASEDIR + NOHASHDIR strip the workspace prefix from cwd
          # and from absolute include paths in compile args / #line markers.
          # SLOPPINESS lets us cache TUs that touch __DATE__/__TIME__ and
          # absorbs include-mtime jitter from re-extracted toolchains/deps.
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,clang_index_store
        run: ci/build.sh build ${{ matrix.kind }}

      - name: ccache post-build stats
        if: always()
        shell: bash
        run: |
          set +o pipefail
          ccache -sv
          echo "--- sample miss reasons ---"
          # Each .ccache-log explains why that TU missed/hit; pull the first
          # 20 logs and print up to 20 verdict lines from each. macOS bash 3.2
          # has no mapfile, so collect via a temp file.
          list=$(mktemp)
          find "${{ github.workspace }}/ccache-debug" -name '*.ccache-log' 2>/dev/null | sort | head -n 20 > "$list"
          while IFS= read -r f; do
            echo "=== $f ==="
            grep -m 20 -E '(Result:|Disabling|Compiler option|preprocessor|hash:|input file|cache hit|cache miss)' "$f" || true
          done < "$list"
          rm -f "$list"

      - name: Upload ccache debug logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccache-debug-${{ matrix.artifact-name }}
          path: ccache-debug
          if-no-files-found: ignore
          retention-days: 3

      - name: Test
        shell: bash
        run: ci/build.sh test ${{ matrix.kind }}

      - name: Install hyperfine
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: hyperfine

      - name: Benchmark
        shell: bash
        run: ci/bench.sh ${{ matrix.kind }} ${{ matrix.artifact-name }}

      - name: Upload bench
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-${{ matrix.artifact-name }}
          path: bench.json
          if-no-files-found: error
          retention-days: 7

      - name: Stage install tree
        shell: bash
        run: ci/build.sh install ${{ matrix.kind }} stage

      - name: Package archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd stage && 7z a "../${{ matrix.artifact-name }}.zip" .)
          else
            tar czf "${{ matrix.artifact-name }}.tar.gz" -C stage .
          fi

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  bench-summary:
    name: Benchmark summary
    needs: build
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download bench artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bench-results
          pattern: bench-*

      - name: Render summary
        run: python3 ci/bench-summary.py bench-results >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  lcg:
    name: LCG 109 (el9-gcc15-opt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@10197e000cc0add8e54ac4fb73d3ed44e2de72b4 # v5.5

      - name: Restore Conan cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.conan2/p
          key: conan-lcg109-${{ hashFiles('conanfile.py') }}-${{ github.run_id }}
          restore-keys: |
            conan-lcg109-${{ hashFiles('conanfile.py') }}-
            conan-lcg109-

      - name: Build and test in LCG view
        uses: aidasoft/run-lcg-view@d8db17c61216548c9192889942d46ff2d7c3a3b6 # v6
        with:
          release-platform: "LCG_109/x86_64-el9-gcc15-opt"
          ccache-key: ccache-lcg109
          run: |
            export CONAN_HOME=$(pwd)/.conan2
            curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
            source "$HOME/.local/bin/env"
            uv tool install conan
            conan profile detect --force
            ci/build.sh conan-install native
            ci/build.sh configure native -DNODEHAMMER_WITH_TGEO=ON -DNODEHAMMER_WITH_DD4HEP=ON
            ci/build.sh build native
            ci/build.sh test native -j4

      # blubb

      - name: Fix Conan cache ownership
        if: always()
        run: sudo chown -R "$USER" "${{ github.workspace }}/.conan2" || true

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.conan2/p
          key: conan-lcg109-${{ hashFiles('conanfile.py') }}-${{ github.run_id }}
