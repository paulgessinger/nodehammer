[build-system]
requires = ["scikit-build-core>=1.0,<2", "nanobind>=2.5", "setuptools_scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "nodehammer"
description = "Detector geometry tessellation and export"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Gessinger" }]
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
]

# The command, without a compiled executable in the wheel. `install.components =
# ["Python"]` below still excludes the CLI binary; this generates a launcher that
# imports the extension and calls into libnodehammer, which is where the CLI
# lives since the command sources joined the core. That is what makes
# `uvx nodehammer` work, and it costs the wheel nothing but a script.
[project.scripts]
nodehammer = "nodehammer.__main__:main"

[project.optional-dependencies]
# load_config(dict) serializes to TOML and hands it to Config.parse, so the
# validator sees exactly what a file would produce. tomli-w is the only thing
# that needs, and the rest of the package needs nothing at runtime.
dict = ["tomli-w>=1.0"]

# Declared and empty on purpose. `nodehammer-web` used to be reachable only
# through `pip install "nodehammer[web]"`; it is a plain dependency now, so this
# extra adds nothing -- but removing it would make that command fail for anyone
# who wrote it down once, and an extra that resolves to nothing is cheaper than
# a line in a changelog nobody reads.
web = []

[project.urls]
Homepage = "https://github.com/paulgessinger/nodehammer"

# The environment the bindings are built against and tested in, named once so
# `just python-deps` and CI's own venv cannot drift apart -- they now install
# this group rather than each repeating the list. nanobind's floor matches
# build-system.requires above: the same nanobind compiles the extension either
# way. Not project dependencies; the wheel needs none of this at runtime.
[dependency-groups]
dev = ["nanobind>=2.5", "pytest", "tomli-w"]

# ── scikit-build-core ────────────────────────────────────────────────────────
[tool.scikit-build]
minimum-version = "1.0"

# The root project requires 3.25, so say so here: scikit-build-core will fetch a
# suitable cmake rather than letting a stale system one fail further in.
cmake.version = ">=3.25"
ninja.version = ">=1.11"

# Under /build, which .gitignore already covers. Keeping it stable (rather than
# the default temp dir) makes rebuilds incremental, and {wheel_tag} keeps it
# clear of `just configure`'s build/RelWithDebInfo.
build-dir = "build/wheel/{wheel_tag}"

# abi3 from 3.12 up. This must agree with nanobind_add_module(STABLE_ABI) and
# with the floor in src/python/CMakeLists.txt's find_package(Python 3.12) —
# three statements of one decision, which is why tests/python asserts the
# resulting filename rather than trusting that they stayed in step.
wheel.py-api = "cp312"

# The pure-Python half, copied from the source tree. The binary half arrives
# from the CMake install below and merges into the same directory.
wheel.packages = ["python/nodehammer"]

# The wheel is the extension plus libnodehammer, and nothing else. Every install
# rule in CMakeLists.txt carries a component, so naming one is a positive
# statement of the payload rather than a list of exclusions: no CLI executable,
# no headers, no nodehammer-config.cmake, no third-party licence staging.
install.components = ["Python"]

# Likewise on the build side. The default builds everything, which for a wheel
# means compiling the CLI, the static archive and the Catch2 binary for nothing.
# nodehammer_shared still gets built — it is what the extension links.
#
# The umbrella target rather than nodehammer_python itself: the wheel needs the
# generated .pyi as well, and naming the extension alone silently skipped the
# stub target while the install rule still expected its output. Depending on the
# umbrella keeps "what a complete package contains" in one place in CMake instead
# of duplicated here, so adding a staged artifact later does not need this line
# edited to match.
build.targets = ["nodehammer_python_package"]

[tool.scikit-build.cmake.define]
NODEHAMMER_BUILD_PYTHON = "ON"
NODEHAMMER_BUILD_TESTS = "OFF"
NODEHAMMER_WITH_VIEWER = "OFF"
NODEHAMMER_WERROR = "OFF"
# CMAKE_TOOLCHAIN_FILE is deliberately absent: Conan writes it to an absolute,
# machine-specific path, so it arrives through the CMAKE_TOOLCHAIN_FILE
# environment variable that `just wheel` exports. See docs/python-bindings-plan.md
# for why Conan runs as an explicit pre-step rather than through cmake-conan's
# dependency provider.

# ── version ──────────────────────────────────────────────────────────────────
# cmake/Version.cmake derives from `git describe`, which yields
# "0.1.3-398-g920e6c5" — not PEP 440, and 0.0.0 in a tagless clone. So the wheel
# version comes from setuptools_scm and is pushed *down* into CMake, which
# prefers SKBUILD_PROJECT_VERSION when it is set. One source of truth per build,
# and the test suite asserts the two agree.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

# ── the dependency on nodehammer-web ─────────────────────────────────────────
# `viewer --web` needs a runtime no native build can produce, so it comes from a
# sibling distribution. That is a plain dependency rather than an extra: the wasm
# never runs unless asked, so a headless install pays 2.9 MB and nothing else,
# and "the GUI works after pip install nodehammer" is worth more than that.
#
# The constraint is *generated*, not typed. Both versions come from setuptools_scm
# reading one git state, so the pin is computed by the build that computes the
# version -- see packaging/plugins/nh_web_pin.py, including why it is same-minor
# rather than exact. This entry must stay *below* the one above it: providers run
# in list order and this one reads the version that one produced.
[[tool.dynamic-metadata]]
provider = { path = "packaging/plugins", module = "nh_web_pin:Provider" }

[tool.setuptools_scm]
# no-guess-dev rather than the default guess-next-dev: the default bumps the
# patch component (0.1.3 plus 398 commits becomes "0.1.4.dev398"), so the base
# would name a tag that does not exist and disagree with PROJECT_VERSION on every
# commit that is not exactly on one. This keeps the base at the tag actually
# found: "0.1.3.post1.dev398+g920e6c5". On a tag both schemes give plain "0.1.3".
version_scheme = "no-guess-dev"

[tool.scikit-build.sdist]
exclude = [
    "/.github",
    # The nodehammer-web wheel's staged payload: 7 MB of Emscripten output that
    # a local `just wheel-web` leaves behind. It is gitignored, but an sdist
    # builder that walks the tree rather than asking git would ship it inside a
    # distribution that has no use for it at all.
    "/packaging/web/src/nodehammer_web/runtime",
    "/analysis",
    "/branding",
    "/build",
    "/docs",
    "/web",
    "*.nhb",
    "*.nhb.zst",
    "*.nhproj",
]

# ── cibuildwheel ─────────────────────────────────────────────────────────────
# One wheel per platform, not one per interpreter: with wheel.py-api = "cp312"
# every cp31x build would emit the same cp312-abi3 file, so building more than
# one is duplicated work for an identical artifact.
[tool.cibuildwheel]
build = "cp312-*"
# musllinux would need its own Conan graph built against musl's toolchain, for an
# audience (Alpine) this project has never targeted. glibc only.
skip = "*-musllinux*"
build-verbosity = 1
test-requires = ["pytest", "tomli-w"]
# Runs against the *installed* wheel in cibuildwheel's own environment, which is
# the only thing that exercises the bundled library and its relative rpath. A
# build tree proves neither.
#
# cibuildwheel installs that wheel *with* dependency resolution, and there is no
# knob to turn that off, so `nodehammer-web==X.Y.*` has to be satisfiable right
# here. Satisfying it from an index would deadlock every minor bump: at the tag
# that introduces X.Y nothing on PyPI matches yet, and the job that uploads it
# is downstream of this one. ci.yml hands this step the web wheel built by the
# same run instead (PIP_FIND_LINKS), so the constraint is always satisfiable and
# the pair is published together, once both halves have been proven installable.
#
# This is still deliberately *not* where the runtime is checked -- find-links
# leaves the index in play for `test-requires`, so the winning candidate is not
# guaranteed to be the same-commit one. `web-pair` installs both from local
# files with --no-index; that is the only place the actual pair is exercised.
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.linux]
# ccache first: it's a system package, not a Python one, and everything after
# this compiles through it. The manylinux_2_28 image ships EPEL already enabled,
# so a plain dnf install resolves it -- no repo wrangling needed.
# Conan next, inside the container, for the reason it runs first everywhere
# else: cppstd, libcxx and the deployment target live in CMakeToolchain, and a
# CMake dependency provider cannot deliver them.
#
# cli11 alone out of the six recipes in recipes/, because it is the only vendored
# one the wheel's graph contains: the other five are the viewer's, and the wheel
# builds with viewer=False. See recipes/cli11/conanfile.py for why it is vendored
# at all. Keep the version in step with conanfile.py, the Justfile and ci/build.sh.
before-all = [
    "dnf install -y ccache",
    "python3 -m pip install conan",
    "conan profile detect --force",
    "conan export {project}/recipes/cli11 --version=2.7.2",
    "conan install {project} -of /tmp/conan -s build_type=Release -s:a compiler.cppstd=23 --build=missing",
]

# cibuildwheel copies the project into the container *without* .git, so
# setuptools_scm cannot derive a version there and the build dies before it
# reaches CMake. The host knows the version, so it computes it and passes it in;
# `just wheel-linux` and the CI job both set it the same way.
# CONAN_HOME and CCACHE_DIR ride along so CI can point them at directories under
# cibuildwheel's /host mount, which is the only way either cache survives the
# container. Unset locally, where the container's own defaults are fine.
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION", "CONAN_HOME", "CCACHE_DIR"]

[tool.cibuildwheel.linux.environment]
CMAKE_TOOLCHAIN_FILE = "/tmp/conan/build/Release/generators/conan_toolchain.cmake"
# scikit-build-core reads CMAKE_ARGS itself (unlike CMAKE_TOOLCHAIN_FILE, CMake
# has no environment-variable fallback for *_COMPILER_LAUNCHER), so this is the
# reliable way to route the build through ccache rather than nodehammer's object
# files recompiling from scratch on every wheel build.
CMAKE_ARGS = "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"

[tool.cibuildwheel.macos]
# Through uv, not the host interpreter. Unlike Linux, macOS before-all runs on
# the *host*, whose python3 is Homebrew's and marked externally managed, so
# `pip install conan` is refused outright (PEP 668). uvx gives Conan an
# environment of its own; uv is on PATH here for the same reason the wheel job's
# version step can call it, and `just` already builds wheels through it.
# The cli11 export is the Linux list's, for the same reason and against the same
# CONAN_HOME -- uvx gives each invocation a fresh environment, not a fresh cache.
before-all = [
    "uvx conan profile detect --force",
    "uvx conan export {project}/recipes/cli11 --version=2.7.2",
    "uvx conan install {project} -of /tmp/nh-conan -s build_type=Release -s:a compiler.cppstd=23 -s os.version=13.3 --build=missing",
]

[tool.cibuildwheel.macos.environment]
CMAKE_TOOLCHAIN_FILE = "/tmp/nh-conan/build/Release/generators/conan_toolchain.cmake"
# Unlike Linux, the macOS build isn't containerized, so ccache (installed by the
# CI job's ccache-action step, same as the build job) is already on PATH and
# CCACHE_DIR already in the environment -- this just has to point CMake at it.
CMAKE_ARGS = "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
# The canonical macOS floor, read from here by the Justfile so the two cannot
# drift. 13.3 is measured, not chosen: Apple's libc++ gates floating-point
# std::to_chars behind it and <format> uses it, so 11.0 does not compile. It must
# match the -s os.version= above, or the dependencies are built for a different
# floor than the wheel claims and delocate rejects the result.
MACOSX_DEPLOYMENT_TARGET = "13.3"
